# Hosts the Proxmox dynamic inventory does not provide: bare-metal hosts,
# the NAS, and the out-of-cluster monitor.
# Tagged VMs are auto-discovered via inventory.proxmox.yml.

[proxmox]
pve ansible_host=192.168.1.10 ansible_user=root
pve2 ansible_host=192.168.1.11 ansible_user=root

[proxmox:vars]
ansible_python_interpreter=/usr/bin/python3

[nas]
truenas ansible_host=192.168.1.15 ansible_user=truenas_admin

# vm117. Static on purpose: it is the monitor of last resort, so deploying
# or fixing it must not depend on the Proxmox API (scripts/run-uptime-kuma.sh
# runs with this file alone). The VM carries no Proxmox tags, so the dynamic
# inventory only places it in proxmox_* groups, which resolve-inventory.sh's
# cache drops; do not also tag it `linux` in Proxmox.
[uptime_kuma]
uptime-kuma ansible_host=192.168.1.129 ansible_user=ladino

[linux:children]
proxmox
nas
uptime_kuma
