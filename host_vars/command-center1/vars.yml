---
# Unattended upgrades — block kubectl (managed via k8s upgrade cycle)
# 1password-cli is intentionally NOT blacklisted — let it auto-update
unattended_upgrades_blacklist:
  - kubectl
  - kubernetes-cni

# Systemd service monitoring
node_exporter_systemd_enabled: true
node_exporter_systemd_units:
  - docker.service
  # node_exporter's systemd collector only sees the SYSTEM manager, so the
  # herdr.service user unit can never appear in node_systemd_unit_state and
  # listing it here would make any rule on it vacuous. user@1000.service is
  # the lingered user manager (ladino) that hosts herdr: it is the closest
  # system-level signal that user services, herdr included, can run at all.
  - user@1000.service

# Herdr headless server systemd user service (roles/cmd_center/tasks/herdr.yml).
# Enabled on this host only.
cmd_center_herdr_enabled: true

# Lab changelog to Discord (roles/cmd_center/tasks/changelog.yml).
# Enabled on this host only.
cmd_center_changelog_enabled: true

# Lab scout weekly ideas digest to Discord (roles/cmd_center/tasks/scout.yml).
# Enabled on this host only.
cmd_center_scout_enabled: true
