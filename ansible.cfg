[defaults]
inventory   = inventory.proxmox.yml,inventory.static.ini
roles_path  = ./roles
vault_password_file = scripts/vault-pass.sh

# Pre-flight 1Password quota gate. Loads for every playbook invocation,
# including interactive ones that bypass the run-*.sh wrappers. On
# 2026-08-23 the account cap went from 7 to 1000 used in under an hour via
# ansible-playbook run straight from a terminal, which no wrapper guard saw.
# The gate fails open; see callback_plugins/op_quota_gate.py.
callback_plugins = ./callback_plugins
# Auto-trust new host keys on first contact (TOFU) but still refuse
# when a known key mismatches. Fits homelab where VMs get rebuilt
# occasionally and the operator is the only one adding new hosts.
# Keeps MITM protection after the first successful connection.
host_key_checking = True

[ssh_connection]
# Use the same policy at the ssh transport layer. `accept-new` means:
# - unknown host -> accept and store key
# - known host with mismatched key -> REFUSE (as it should)
# The old behavior of refusing unknown hosts caused scheduled playbook
# runs to fail whenever a VM was rebuilt and its host keys changed.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts

# Absorb a transient unreachable instead of failing the whole run. Ansible
# defaults to 0 retries and only retries on ssh return code 255, which is
# exactly what a reaped ControlMaster socket produces (verified by
# reproduction). Without this, one dropped socket on one host marks the run
# failed even though every other host reported ok.
#
# This key MUST live in [ssh_connection]. There is no `retries` ini key under
# [defaults]; put it there and it parses clean and does nothing.
retries = 3
