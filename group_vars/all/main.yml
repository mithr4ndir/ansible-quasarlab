ansible_user: ladino

# KeepAliveD configuration VIP
vip_address: 192.168.1.20

# NGINX LB cert paths
nginx_lb_cert: "/etc/nginx/certs/tls.crt"
nginx_lb_key:  "/etc/nginx/certs/tls.key"

# Kubernetes package version, the single source of truth for kubectl
# (roles/common/apps/kubectl) and kubelet/kubeadm (roles/k8s/kube_pkg).
# Pinned to exactly what the cluster runs, so the client never drifts from the
# server. roles/common/apps/kubectl derives its apt channel from this value;
# roles/k8s/kube_pkg still hardcodes the v1.33 channel, so a MINOR upgrade must
# bump that too. A patch upgrade is this one line. Never use `latest` or an
# unpinned state: that is how command-center1 silently sat at 1.33.3 against a
# 1.33.11 cluster.
kube_version: "1.33.11-1.1"

# Argo CD configuration
argocd_git_repo: "https://github.com/mithr4ndir/k8s-argocd.git"
argocd_version: "v3.0.23"
argocd_namespace: "argocd"
argocd_server_service_type: "LoadBalancer"

kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"
