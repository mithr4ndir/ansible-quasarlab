---
# Coordinated UPS shutdown for the Proxmox hosts (NUT secondaries).
# The TrueNAS NAS is the NUT primary (UPS USB attached) and is configured
# separately in the TrueNAS UPS service. See roles/nut_client.
#
# Run it through scripts/run-ups-shutdown.sh. The upsmon password comes from the
# NUT_MONITOR_PASSWORD env var, which the wrapper fills from the shared 1Password
# cache (scripts/lib/op-secret-cache.sh), served stale when 1Password is down or
# kill-switched. Do not fill it from a live 1Password read by hand: that bypasses
# the cache and the kill switch. If nothing is cached and 1Password is
# unavailable, export NUT_MONITOR_PASSWORD yourself and still use the wrapper.
- name: Configure NUT UPS-triggered shutdown on Proxmox hosts
  hosts: proxmox
  become: true
  pre_tasks:
    - name: Assert NUT_MONITOR_PASSWORD env is populated
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.assert:
        that:
          - lookup('env', 'NUT_MONITOR_PASSWORD') | length > 0
        fail_msg: >-
          NUT_MONITOR_PASSWORD is empty or unset. Run via
          scripts/run-ups-shutdown.sh, which resolves it from the shared
          1Password cache.
        quiet: true

    - name: Resolve NUT monitor password from env
      ansible.builtin.set_fact:
        nut_monitor_password: "{{ lookup('env', 'NUT_MONITOR_PASSWORD') }}"
      no_log: true
  roles:
    - nut_client
