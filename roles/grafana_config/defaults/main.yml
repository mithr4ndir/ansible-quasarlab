---
grafana_provisioning_dir: /etc/grafana/provisioning
grafana_dashboards_dir: /var/lib/grafana/dashboards
grafana_alerting_dir: /etc/grafana/provisioning/alerting
# Read dashboards from the automation checkout, which the runner pins to
# origin/master, rather than from the operator's working tree.
observability_repo_path: /var/lib/ansible-quasarlab/observability

grafana_plugins:
  - grafana-opensearch-datasource
