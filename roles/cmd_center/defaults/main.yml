---
# Operator working tree. Humans edit this; scheduled runs must NOT use it.
ansible_repo_path: /home/{{ ansible_user }}/code/ansible-quasarlab

# Automation checkouts. Dedicated to the systemd timers, never edited by hand,
# and force-synced to their remote ref at the start of every run. Keeping these
# separate is what lets the operator leave any branch checked out under
# ~/code without that branch being deployed to the fleet.
# Bound the oneshot runtime. systemd will not re-trigger a timer whose service
# is still `activating`, so an unbounded run that hangs silently ends ALL future
# runs -- the same failure that stopped apt patching for 11 days (PR #138).
ansible_timer_timeout_start_sec: 3600

ansible_automation_root: /var/lib/ansible-quasarlab
ansible_automation_repo_path: "{{ ansible_automation_root }}/repo"
ansible_automation_repos:
  - name: repo
    url: "git@github.com:mithr4ndir/ansible-quasarlab.git"
    version: main

# Architecture for binary downloads. Used by helm, yq, and apt repo
# entries. Override for ARM hosts if ever needed.
dpkg_arch: amd64
helm_arch: amd64

# HashiCorp apt repository (terraform). See tasks/hashicorp_apt.yml.
#
# The fingerprint is the full v4 fingerprint of HashiCorp's Linux package
# signing key, NOT a short key id. Source: the Linux package signing keys on
# https://www.hashicorp.com/trust/security, which on 2026-09-13 listed
#   current:  D55C 0D1A C78A 8D81 26CB 631C FC9C A96A CA02 6560
#   previous: 798A EC65 4E5C 1542 8C8E 42EE AA16 FCBC A621 E701
#             (active 2023-01-23 to 2026-09-10)
# Cross-checked the same day: the key served at hashicorp_apt_key_url has this
# fingerprint, and gpgv verifies dists/noble/InRelease with it. When HashiCorp
# rotates again, confirm the new fingerprint on that page before bumping this.
hashicorp_apt_repo_url: https://apt.releases.hashicorp.com
hashicorp_apt_key_url: https://apt.releases.hashicorp.com/gpg
hashicorp_apt_key_fingerprint: D55C0D1AC78A8D8126CB631CFC9CA96ACA026560
hashicorp_apt_keyring: /etc/apt/keyrings/hashicorp-archive-keyring.gpg

# CLI tool versions. Pinned so upgrades are intentional.
helm_version: "3.19.0"
yq_version: "4.47.2"

# Node.js runtime (standalone install for user-scoped tools like the
# spec-workflow dashboard, isolated from system apt Node).
node_version: "22.16.0"
node_install_dir: "/home/{{ ansible_user }}/.local/lib/nodejs"

# Homelab git repos cloned onto the command center. claude-config MUST
# come first; claude_bootstrap.yml depends on it being present before
# it runs bootstrap.sh. Order for the rest does not matter.
lab_repos:
  - name: claude-config
    url: "git@github.com:mithr4ndir/claude-config.git"
  - name: ansible-quasarlab
    url: "git@github.com:mithr4ndir/ansible-quasarlab.git"
  - name: k8s-argocd
    url: "git@github.com:mithr4ndir/k8s-argocd.git"
  - name: observability-quasarlab
    url: "git@github.com:mithr4ndir/observability-quasarlab.git"
  - name: terraform-quasarlab
    url: "git@github.com:mithr4ndir/terraform-quasarlab.git"
  - name: quasarlab-disaster-recovery
    url: "git@github.com:mithr4ndir/quasarlab-disaster-recovery.git"
  - name: truenas-config-backup
    url: "git@github.com:mithr4ndir/truenas-config-backup.git"

# spec-workflow dashboard systemd user service.
# Binds to 0.0.0.0 by default so other hosts on the home lab LAN can
# reach it. CORS disabled because the dashboard's built-in allowlist
# only covers localhost, not LAN IPs.
spec_workflow_port: 5000
spec_workflow_bind_address: "0.0.0.0"
spec_workflow_allow_external_access: true
spec_workflow_cors_enabled: false

# Herdr headless server systemd user service. Off by default; enabled
# only for command-center1 in its host_vars. cmd_center_herdr_bin_path
# must match the %h/.local/bin/herdr path hard-coded in herdr.service.j2.
cmd_center_herdr_enabled: false
cmd_center_herdr_bin_path: "/home/{{ ansible_user }}/.local/bin/herdr"
# Symlink to the binary on the default non-login PATH, so `herdr --remote`
# can find it over SSH (see tasks/herdr.yml).
cmd_center_herdr_link_path: /usr/local/bin/herdr

# Pinned herdr release (stable channel, linux-x86_64 static-pie binary).
# The checksum is for that one asset. Recorded 2026-09-12 for 0.9.0, where
# it matched in three places: the sha256 map in https://herdr.dev/latest.json
# (what herdr's own installer verifies against), a fresh download of
# cmd_center_herdr_url, and the binary already installed on command-center1.
# herdrdev/herdr also holds a GitHub attestation record for this digest,
# which was seen but not cryptographically verified.
#
# Upgrades are explicit, never automatic: bump both values together, then
# run with -e cmd_center_herdr_upgrade=true. Without the flag, a binary
# that does not match the pin fails the play rather than being replaced.
cmd_center_herdr_version: "0.9.0"
cmd_center_herdr_sha256: "4fa1a01158dd8043da92d31b270780b0dcc10603038d9b61cac4d81ab63fb71f"
cmd_center_herdr_url: "https://github.com/herdrdev/herdr/releases/download/v{{ cmd_center_herdr_version }}/herdr-linux-x86_64"
cmd_center_herdr_upgrade: false

# herdr.service health exported through the node_exporter textfile
# collector by a systemd user timer.
cmd_center_herdr_health_prom_file: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfiles') }}/herdr.prom"
cmd_center_herdr_health_interval: 1min

# Lab changelog posted to Discord (tasks/changelog.yml). Off by default;
# enabled only for command-center1 in its host_vars.
cmd_center_changelog_enabled: false
cmd_center_changelog_repos:
  - mithr4ndir/ansible-quasarlab
  - mithr4ndir/k8s-argocd
  - mithr4ndir/terraform-quasarlab
  - mithr4ndir/quasarlab-docs
# 1Password reference for the Discord webhook URL, resolved only through the
# secret cache. The default is the "Discord Changelog Webhook" item, a webhook
# named changelog in the #activity channel. Never reuse another consumer's
# webhook item: rmmf24ed... is the Donchian trading signals channel.
#
# The cache slug is keyed by this reference:
#   discord_changelog_webhook_url.<first 16 hex chars of sha256(reference)>
# so changing the reference starts a new cache entry (one 1Password read on
# the next post) instead of posting to the previous channel. Get the slug with
#   printf '%s' 'op://...' | sha256sum | cut -c1-16
# Seed it without a read by writing the URL, no trailing newline, to
# /var/lib/ansible-quasarlab/secrets/<slug> (ansible_user, mode 0600). Refresh
# it after editing the item with scripts/op-secret-refresh.sh <slug>. An entry
# for a reference no longer in use can be deleted.
cmd_center_changelog_op_reference: "op://Infrastructure/6pu46lg64wvtd62hxvgcffc7jq/webhook_url"
# systemd OnCalendar for the daily run.
cmd_center_changelog_on_calendar: "*-*-* 23:55:00 UTC"
cmd_center_changelog_timeout_start_sec: 1800
# SessionEnd hook runs post only for sessions at least this long.
cmd_center_changelog_session_min_secs: 600
# Highlight bullets generated by claude from PR and issue titles and bodies
# only. Off by default: in review on 2026-09-14 haiku merged two numbers from
# a PR body into a false claim, so highlights are the plain PR titles. When
# enabled, failure or timeout falls back to the plain list.
cmd_center_changelog_highlights_enabled: false
cmd_center_changelog_claude_bin: "/home/{{ ansible_user }}/.local/bin/claude"
cmd_center_changelog_claude_model: haiku
cmd_center_changelog_claude_timeout: 90
