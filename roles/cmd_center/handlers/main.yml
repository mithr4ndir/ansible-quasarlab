---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart ansible-proxmox timer
  ansible.builtin.systemd:
    name: ansible-proxmox.timer
    state: restarted

- name: Restart ansible-security timer
  ansible.builtin.systemd:
    name: ansible-security.timer
    state: restarted

# User systemd handlers for the spec-workflow dashboard. They run WITHOUT
# become, as the SSH connection user, like every user-scope task in this
# role (see tasks/herdr.yml). pam_systemd gives that session the correct
# XDG_RUNTIME_DIR, so no environment override is needed.
#
# Never build /run/user/<uid> from ansible_user_uid: the play sets become,
# so facts are gathered as root and that fact is 0. See
# tests/test_systemd_user_scope.py.
- name: Reload user systemd
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: false

- name: Restart spec-workflow-dashboard
  ansible.builtin.systemd:
    name: spec-workflow-dashboard
    scope: user
    state: restarted
  become: false
