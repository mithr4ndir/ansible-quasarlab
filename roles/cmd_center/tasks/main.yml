---
# Orchestrator for the cmd_center role. Task files are included in the
# order below; each file is standalone and can be run selectively with
# its matching tag (see the `tags:` key in each file).
#
# Planned future task files (per spec cmd-center-dr-provisioning):
#   onepassword_token.yml   1P service account token from vault
#   ssh_keys.yml            SSH keys from 1P via op

# First on purpose: until it runs, every SSH exec into this host costs a
# 1Password read (see shell_env.yml). It needs no apt access, so it stays
# ahead of the apt work below.
- name: Shell startup without 1Password reads
  ansible.builtin.import_tasks: shell_env.yml

# Must precede packages.yml: a stale third-party apt key fails every apt cache
# update, including the one there. See hashicorp_apt.yml.
- name: HashiCorp apt signing key and source definition
  ansible.builtin.import_tasks: hashicorp_apt.yml

- name: System packages and Ansible collections
  ansible.builtin.import_tasks: packages.yml

- name: CLI tools (gh, terraform, helm, yq, jq)
  ansible.builtin.import_tasks: cli_tools.yml

- name: Kubeconfig fetch and install
  ansible.builtin.import_tasks: kubeconfig.yml

- name: Periodic Ansible playbook systemd timers
  ansible.builtin.import_tasks: ansible_timers.yml

- name: Enable systemd linger for user services
  ansible.builtin.import_tasks: linger.yml

- name: Clone homelab git repos
  ansible.builtin.import_tasks: git_repos.yml

- name: Bootstrap claude-config symlinks and settings
  ansible.builtin.import_tasks: claude_bootstrap.yml

- name: Standalone Node.js runtime for user-scoped tools
  ansible.builtin.import_tasks: node_runtime.yml

- name: Spec Workflow MCP dashboard systemd user service
  ansible.builtin.import_tasks: spec_workflow.yml

- name: ce:review run viewer systemd user service
  ansible.builtin.import_tasks: ce_review_viewer.yml

- name: Lab changelog posted to Discord
  ansible.builtin.import_tasks: changelog.yml
  when: cmd_center_changelog_enabled | bool

- name: Herdr headless server systemd user service
  ansible.builtin.import_tasks: herdr.yml
  when: cmd_center_herdr_enabled | bool

# herdr.yml is skipped entirely when herdr is disabled, so the link it creates
# for `herdr --remote` is cleaned up here instead of being left dangling. Only
# a symlink that points at the managed binary is removed; anything else at
# that path was not put there by this role and is left alone.
- name: Remove the herdr --remote link when herdr is disabled
  when: not (cmd_center_herdr_enabled | bool)
  tags:
    - herdr
  block:
    - name: Check the herdr --remote link
      ansible.builtin.stat:
        path: "{{ cmd_center_herdr_link_path }}"
        follow: false
        get_checksum: false
      register: cmd_center_herdr_link_stat

    - name: Remove the herdr --remote link
      ansible.builtin.file:
        path: "{{ cmd_center_herdr_link_path }}"
        state: absent
      become: true
      when: cmd_center_herdr_link_stat.stat.lnk_target | default('') == cmd_center_herdr_bin_path
