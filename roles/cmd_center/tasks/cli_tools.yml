---
# Install CLI tools needed for day-to-day homelab ops:
#   jq, yq   YAML/JSON processing (helm + kustomize rendering)
#   gh       GitHub CLI (PRs, issues, auth for git push)
#   helm     Helm client for chart rendering
#   terraform HashiCorp Terraform for IaC
#
# The `op` 1Password CLI is handled by the separate onepassword_cli role.
#
# Tools that have official apt repos (gh, terraform) are installed via
# apt so they track upstream. yq and helm ship as single binaries with
# no apt repo, so they are downloaded to /usr/local/bin at a pinned
# version.

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  tags:
    - cli_tools

- name: Install jq
  ansible.builtin.apt:
    name: jq
    state: present
  become: true
  tags:
    - cli_tools

# GitHub CLI (gh): official apt repo at cli.github.com
- name: Download GitHub CLI apt signing key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  become: true
  tags:
    - cli_tools

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dpkg_arch }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  become: true
  tags:
    - cli_tools

- name: Install gh
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
  become: true
  tags:
    - cli_tools

# HashiCorp Terraform. The signing key and the single source definition are
# owned by hashicorp_apt.yml, which main.yml imports before any apt cache
# update so a rotated key cannot fail the whole play first.
- name: Install terraform
  ansible.builtin.apt:
    name: terraform
    state: present
    update_cache: true
  become: true
  tags:
    - cli_tools

# Helm: single binary, no apt repo. Pinned version via defaults.
#
# The versioned binary is the only install marker. The download, extract, and
# copy all hang off one stat of it, so they skip and run together: a host that
# already has the binary skips all three, even after a reboot has cleared
# /tmp, instead of copying from a staging directory that no longer exists.
#
# The archive is extracted into a fresh root-only (0700) directory from
# tempfile, never a fixed /tmp path that another user could create or seed
# first, and with --no-same-owner so extracted files belong to root rather
# than the uid recorded in the tarball. The directory is removed whether or
# not the install succeeds.
- name: Check for the pinned helm binary
  ansible.builtin.stat:
    path: "/usr/local/bin/helm-v{{ helm_version }}"
    get_checksum: false
  register: cmd_center_helm_bin
  tags:
    - cli_tools

# Nothing is downloaded under --check, so the pending install is reported
# here instead of failing on a staging directory that was never filled.
- name: Report the pending helm install under check mode
  ansible.builtin.debug:
    msg: "Would install helm {{ helm_version }} to /usr/local/bin/helm-v{{ helm_version }}"
  changed_when: true
  when:
    - ansible_check_mode
    - not cmd_center_helm_bin.stat.exists
  tags:
    - cli_tools

- name: Install the pinned helm binary
  when:
    - not ansible_check_mode
    - not cmd_center_helm_bin.stat.exists
  become: true
  tags:
    - cli_tools
  block:
    - name: Create a root-only staging directory for the helm archive
      ansible.builtin.tempfile:
        state: directory
        prefix: helm.
      register: cmd_center_helm_staging

    - name: Extract helm into the staging directory
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        dest: "{{ cmd_center_helm_staging.path }}"
        remote_src: true
        include:
          - "linux-{{ helm_arch }}/helm"
        extra_opts:
          - --no-same-owner

    - name: Install helm to /usr/local/bin with versioned name
      ansible.builtin.copy:
        src: "{{ cmd_center_helm_staging.path }}/linux-{{ helm_arch }}/helm"
        dest: "/usr/local/bin/helm-v{{ helm_version }}"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
  always:
    - name: Remove the helm staging directory
      ansible.builtin.file:
        path: "{{ cmd_center_helm_staging.path }}"
        state: absent
      when: cmd_center_helm_staging.path is defined

- name: Symlink helm version to /usr/local/bin/helm
  ansible.builtin.file:
    src: "/usr/local/bin/helm-v{{ helm_version }}"
    dest: /usr/local/bin/helm
    state: link
    force: true
  become: true
  tags:
    - cli_tools

# yq: single binary from GitHub releases. Pinned version via defaults.
- name: Install yq binary
  ansible.builtin.get_url:
    url: "https://github.com/mikefarah/yq/releases/download/v{{ yq_version }}/yq_linux_{{ helm_arch }}"
    dest: "/usr/local/bin/yq-v{{ yq_version }}"
    owner: root
    group: root
    mode: '0755'
  become: true
  tags:
    - cli_tools

- name: Symlink yq version to /usr/local/bin/yq
  ansible.builtin.file:
    src: "/usr/local/bin/yq-v{{ yq_version }}"
    dest: /usr/local/bin/yq
    state: link
    force: true
  become: true
  tags:
    - cli_tools

- name: Verify CLI tools are on PATH with expected versions
  ansible.builtin.command: "{{ item }}"
  loop:
    - gh --version
    - terraform version
    - helm version --short
    - yq --version
    - jq --version
  register: cmd_center_cli_tools_check
  changed_when: false
  failed_when: cmd_center_cli_tools_check.rc != 0
  tags:
    - cli_tools
