---
# Lab scout (bot persona: Radagast): a weekly Discord digest of homelab
# project ideas. See files/lab-scout for the details.
#
#   /usr/local/bin/lab-scout        the script, root-owned so the user it
#                                   runs as cannot rewrite it
#   /etc/default/lab-scout          settings
#   /etc/lab-scout/profile.yaml     lab profile given to the model as data
#   /var/lib/lab-scout              seen state and lock (local disk, never
#                                   NFS), ansible_user only
#   lab-scout.timer (system)        `lab-scout weekly` as ansible_user
#
# Gated in main.yml on cmd_center_scout_enabled, which defaults to false and
# is set true only in host_vars/command-center1.
#
# Depends on:
#   - cli_tools.yml       gh, which must be logged in as ansible_user
#   - git_repos.yml       the k8s-argocd and ansible-quasarlab checkouts the
#                         inventory is read from (origin/main only)
#   - ansible_timers.yml  the automation checkout whose scripts/lib provides
#                         the 1Password kill switch and secret cache
#
# The webhook URL is never templated or stored by this role. The script reads
# it at run time through the 1Password secret cache and posts nothing when the
# cache has no value. The slug is discord_lab_scout_webhook_url.<tag>, where
# the tag is 16 hex chars of sha256 over cmd_center_scout_op_reference; see
# defaults/main.yml for seeding and refreshing it.

- name: Install lab-scout script
  ansible.builtin.copy:
    src: lab-scout
    dest: /usr/local/bin/lab-scout
    owner: root
    group: root
    mode: '0755'
  tags:
    - scout

- name: Deploy lab-scout settings
  ansible.builtin.template:
    src: lab-scout.default.j2
    dest: /etc/default/lab-scout
    owner: root
    group: root
    mode: '0644'
  tags:
    - scout

- name: Create lab-scout config directory
  ansible.builtin.file:
    path: /etc/lab-scout
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - scout

- name: Deploy lab-scout profile
  ansible.builtin.template:
    src: lab-scout.profile.yaml.j2
    dest: /etc/lab-scout/profile.yaml
    owner: root
    group: root
    mode: '0644'
  tags:
    - scout

- name: Create lab-scout state directory
  ansible.builtin.file:
    path: "{{ cmd_center_scout_state_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'
  tags:
    - scout

- name: Deploy lab-scout systemd service
  ansible.builtin.template:
    src: lab-scout.service.j2
    dest: /etc/systemd/system/lab-scout.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart lab-scout timer
  tags:
    - scout

- name: Deploy lab-scout systemd timer
  ansible.builtin.template:
    src: lab-scout.timer.j2
    dest: /etc/systemd/system/lab-scout.timer
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart lab-scout timer
  tags:
    - scout

# daemon_reload here as well as in the handler: on the first run the timer is
# enabled before handlers fire, and systemd would not know the new unit yet.
- name: Enable and start lab-scout timer
  ansible.builtin.systemd:
    name: lab-scout.timer
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - scout
