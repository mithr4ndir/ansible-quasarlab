---
# Lab changelog: a short summary of merged PRs and opened or closed issues,
# posted to Discord. See files/lab-changelog for the details.
#
#   /usr/local/bin/lab-changelog     the script, root-owned so the user it
#                                    runs as cannot rewrite it
#   /etc/default/lab-changelog       settings read by both entry points
#   lab-changelog.timer (system)     `lab-changelog daily` as ansible_user
#
# The other entry point, `lab-changelog session-end`, is a Claude Code
# SessionEnd hook registered in claude-config, not here.
#
# Gated in main.yml on cmd_center_changelog_enabled, which defaults to false
# and is set true only in host_vars/command-center1.
#
# Depends on:
#   - cli_tools.yml     gh, which must be logged in as ansible_user
#   - ansible_timers.yml  the automation checkout whose scripts/lib provides
#                         the 1Password kill switch and secret cache
#
# The webhook URL is never templated or stored by this role. The script reads
# it at run time through the 1Password secret cache and posts nothing when the
# cache has no value. The slug is discord_changelog_webhook_url.<tag>, where
# the tag is 16 hex chars of sha256 over cmd_center_changelog_op_reference;
# see defaults/main.yml for seeding and refreshing it.

- name: Install lab-changelog script
  ansible.builtin.copy:
    src: lab-changelog
    dest: /usr/local/bin/lab-changelog
    owner: root
    group: root
    mode: '0755'
  tags:
    - changelog

- name: Deploy lab-changelog settings
  ansible.builtin.template:
    src: lab-changelog.default.j2
    dest: /etc/default/lab-changelog
    owner: root
    group: root
    mode: '0644'
  tags:
    - changelog

- name: Deploy lab-changelog systemd service
  ansible.builtin.template:
    src: lab-changelog.service.j2
    dest: /etc/systemd/system/lab-changelog.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart lab-changelog timer
  tags:
    - changelog

- name: Deploy lab-changelog systemd timer
  ansible.builtin.template:
    src: lab-changelog.timer.j2
    dest: /etc/systemd/system/lab-changelog.timer
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart lab-changelog timer
  tags:
    - changelog

# daemon_reload here as well as in the handler: on the first run the timer is
# enabled before handlers fire, and systemd would not know the new unit yet.
- name: Enable and start lab-changelog timer
  ansible.builtin.systemd:
    name: lab-changelog.timer
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - changelog
