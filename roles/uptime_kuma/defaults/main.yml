---
# Uptime Kuma on vm117: the lab's monitor from OUTSIDE the Kubernetes cluster.
# Applied by playbooks/uptime-kuma.yml, run through scripts/run-uptime-kuma.sh.
# See README.md in this role for the design and the deploy runbook.

uptime_kuma_dir: /opt/uptime-kuma
uptime_kuma_data_dir: "{{ uptime_kuma_dir }}/data"
uptime_kuma_autokuma_data_dir: "{{ uptime_kuma_dir }}/autokuma-data"
uptime_kuma_monitors_dir: "{{ uptime_kuma_dir }}/monitors"
uptime_kuma_secrets_dir: "{{ uptime_kuma_dir }}/secrets"
uptime_kuma_tls_dir: "{{ uptime_kuma_dir }}/tls"
uptime_kuma_tls_days: 825

# Images are pinned by digest; the tag is there for humans. Both digests are
# the multi-arch index digests, read from the registries on 2026-09-19.
#
# Kuma 2.x, not the `louislam/uptime-kuma:1` the labctl run used: 1.23.17 is
# the last 1.x release and GHSA-v832-4r73-wx5j (SSTI in notification
# templates, file read) is fixed only in 2.2.1+. 2.5.5 also carries the
# 2.5.4 jsonata CVE and DoS fixes. The rootless variant runs as `node`
# (uid 1000); slim leaves out the embedded MariaDB and Chromium, neither used.
uptime_kuma_image: "louislam/uptime-kuma:2.5.5-slim-rootless@sha256:a292237a108fa8843d09bb4066e738f02e913ef893542740f80c26556601ab77"
uptime_kuma_uid: 1000

# AutoKuma reconciles the monitors in uptime_kuma_monitors_dir into Kuma, so
# they live in this repo instead of only in Kuma's SQLite database.
#
# Pinned to the release candidate 2.1.0-rc.2 ON PURPOSE (owner decision,
# 2026-09-19, #178), by tag and digest. Do not "tidy" this back to the stable
# 2.0.0 without re-running the comparison. Both were run end to end against
# Kuma 2.5.5 with this role's compose file and all eight monitors; both
# created every monitor once and delivered alerts, but 2.0.0:
#   - never synced again after a Kuma-only restart (crash, OOM, docker
#     restart): "You are not logged in" on every sync, 10 times in 90s
#     (AutoKuma#157). Monitors-as-code would silently stop after any Kuma
#     crash. rc.2 picked up a new monitor file 10s after the same restart.
#   - sent each new monitor's first DOWN alert twice and made Kuma log
#     SQLITE_CONSTRAINT UNIQUE failures on stat_daily (AutoKuma#166). rc.2:
#     one alert, clean log.
# AutoKuma is outside the alerting path (Kuma does the checks and sends the
# alerts), and Kuma itself stays on a stable release.
# Revisit when AutoKuma ships a stable release containing the #157 fix: move
# to it, re-run the end-to-end comparison, update this comment.
# The image runs as root by default, so the compose file drops it to
# uptime_kuma_autokuma_uid. The password reaches it through a config file
# (see compose.yaml.j2), which works on both 2.0.0 and rc.2.
uptime_kuma_autokuma_image: "ghcr.io/bigboot/autokuma:2.1.0-rc.2@sha256:12ed0e5085feeac65db760c1a3e3d4fa3acea0e7dc4c0e601e2ea64d82485a45"
uptime_kuma_autokuma_uid: 65532

# TLS-terminating proxy in front of Kuma: nginx stable 1.30.5, the
# unprivileged image (runs as uid 101, listens above 1024, no capabilities).
# Index digest read from Docker Hub on 2026-09-19.
uptime_kuma_proxy_image: "nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:daa17b944bac2b578e962da4c61ad72a59233b3c63abea17113acaf4e6b9aea4"
uptime_kuma_proxy_uid: 101
# Supplementary gid given to both containers so they can read the admin
# password file secret (root:<gid> 0440). Numeric only; no host group needed.
uptime_kuma_secrets_gid: 3001
# Seconds between AutoKuma syncs. Its default of 5 is a full monitor list
# fetch every 5 seconds, which buys nothing here.
uptime_kuma_autokuma_sync_interval: 60

uptime_kuma_port: 3001
# kuma-proxy publishes the UI here, TLS only. Kuma itself publishes nothing.
uptime_kuma_listen_address: "0.0.0.0"
uptime_kuma_admin_username: admin

# Docker CE from Docker's own apt repo. Debian 12's docker.io (20.10.24) has
# no compose v2 plugin, which is why the original `docker compose up -d` in
# labctl-runs/uptime-kuma never ran: `docker: 'compose' is not a docker
# command` (verified on vm117 2026-09-19). Fingerprint of Docker's release
# key, as published in Docker's install docs and served at the key URL on
# 2026-09-19.
uptime_kuma_docker_apt_repo_url: https://download.docker.com/linux/debian
uptime_kuma_docker_apt_key_url: https://download.docker.com/linux/debian/gpg
uptime_kuma_docker_apt_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
uptime_kuma_docker_apt_keyring: /etc/apt/keyrings/docker.gpg
uptime_kuma_docker_arch_map:
  x86_64: amd64
  aarch64: arm64

# Discord. The webhook URL is never set here: playbooks/uptime-kuma.yml fills
# uptime_kuma_discord_webhook_url from UPTIME_KUMA_DISCORD_WEBHOOK_URL, which
# scripts/run-uptime-kuma.sh resolves from the 1Password cache (the #alerts
# webhook, item vausmfy2q2m57r6scvziyrc7lq, field credential). Alerts go
# straight to Discord, NOT through discord-alert-proxy: the proxy runs in the
# cluster this is meant to watch.
uptime_kuma_discord_webhook_url: ""
uptime_kuma_discord_notification_name: "Discord #alerts (direct, not via discord-alert-proxy)"
uptime_kuma_discord_username: "Amon Hen (Uptime Kuma, outside the cluster)"
# When set, the deploy fails unless the webhook belongs to this channel id.
# The webhook's name and channel id are printed on every run either way. On
# 2026-09-14 a changelog went to the trading channel because a webhook item
# was assumed, not checked.
uptime_kuma_discord_expected_channel_id: ""

# Monitor timing shared by the HTTP monitors. max_retries 2 means three
# failed checks, about 3 minutes, before a DOWN alert; resend 60 re-alerts
# hourly while something stays down (the 2026-09-19 outage lasted 11 hours).
uptime_kuma_monitor_interval: 60
uptime_kuma_monitor_retry_interval: 60
uptime_kuma_monitor_max_retries: 2
uptime_kuma_monitor_timeout: 20
uptime_kuma_monitor_resend_interval: 60

# HTTP monitors. `id` is the AutoKuma id and the file name under
# uptime_kuma_monitors_dir; renaming it deletes and recreates the monitor
# (with its history). Removing an entry deletes the monitor.
uptime_kuma_http_monitors:
  - id: prometheus
    name: Prometheus
    url: http://192.168.1.230:9090/-/ready
  - id: alertmanager
    name: Alertmanager
    url: http://192.168.1.233:9093/-/ready
  - id: grafana
    name: Grafana
    url: http://192.168.1.229/api/health
  - id: loki
    name: Loki
    url: http://192.168.1.231:3100/ready
  # /readyz, not a TCP check on 6443: it includes etcd, so an apiserver that
  # is up but has lost etcd reports 500 here. Anonymous access to /readyz is
  # the kubeadm default (system:public-info-viewer). The apiserver cert is
  # issued by the cluster CA, hence ignore_tls; nothing is sent but a GET.
  - id: k8s-api-k8cluster1
    name: Kubernetes API k8cluster1
    url: https://192.168.1.90:6443/readyz
    ignore_tls: true
  - id: k8s-api-k8cluster2
    name: Kubernetes API k8cluster2
    url: https://192.168.1.89:6443/readyz
    ignore_tls: true
  - id: k8s-api-k8cluster3
    name: Kubernetes API k8cluster3
    url: https://192.168.1.91:6443/readyz
    ignore_tls: true

# NFS probe (files/kuma-nfs-probe, run by kuma-nfs-probe.timer). It reads a
# sentinel file on the export over a userspace NFS client with a hard time
# bound and pushes the result to a Kuma push monitor. See the script header.
uptime_kuma_nfs_probe_enabled: true
uptime_kuma_nfs_probe_monitor_id: nfs-tank-k8s
uptime_kuma_nfs_probe_monitor_name: "NFS read 192.168.1.15:/mnt/tank/k8s"
uptime_kuma_nfs_probe_server: 192.168.1.15
uptime_kuma_nfs_probe_export: /mnt/tank/k8s
uptime_kuma_nfs_probe_sentinel: .uptime-kuma-nfs-probe
uptime_kuma_nfs_probe_content: "uptime-kuma nfs probe sentinel v1, created by roles/uptime_kuma. Safe to leave; the probe only reads it.\n"
# NFSv3: stateless, and what k8s-argocd#213 proposes moving the cluster to.
# libnfs 4.0 (Debian 12) has no NFSv4.1 sessions, so it could not exercise
# the v4.1 session path that deadlocked on 2026-09-19 anyway.
uptime_kuma_nfs_probe_version: 3
# AUTH_SYS identity presented to the NAS. 0 matches what the k8s nodes send;
# the export's maproot/mapall decides what it becomes. The sentinel is
# created (once, at deploy) and read with the same identity.
uptime_kuma_nfs_probe_uid: 0
uptime_kuma_nfs_probe_gid: 0
# Hard bound on one read, in seconds. A healthy read is a few milliseconds.
uptime_kuma_nfs_probe_timeout: 20
uptime_kuma_nfs_probe_every: 60
# Push monitor heartbeat window. No push for this long counts as a failed
# check, so a dead timer, script or VM alerts too. max_retries 1: two misses
# or two DOWN pushes in a row before the alert.
uptime_kuma_nfs_probe_heartbeat: 150
uptime_kuma_nfs_probe_max_retries: 1

# What tasks/verify.yml requires Kuma to hold after a deploy. Derived; do not
# set.
uptime_kuma_expected_monitor_names: >-
  {{ (uptime_kuma_http_monitors | map(attribute='name') | list)
     + ([uptime_kuma_nfs_probe_monitor_name] if uptime_kuma_nfs_probe_enabled | bool else []) }}
