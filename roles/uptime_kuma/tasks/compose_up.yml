---
# Render compose.yaml for the current uptime_kuma_bind_address, bring the
# stack up, and wait until Kuma really answers on the host. Included twice by
# kuma.yml: loopback first, then LAN.

- name: Write compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ uptime_kuma_dir }}/compose.yaml"
    owner: root
    group: root
    mode: '0644'

- name: Bring up Kuma and AutoKuma
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_dir }}"
    files:
      - compose.yaml
    state: present
    pull: missing
    remove_orphans: true
  register: uptime_kuma_compose

- name: Remember whether this run (re)created a container
  ansible.builtin.set_fact:
    uptime_kuma_stack_changed: "{{ (uptime_kuma_stack_changed | default(false) | bool) or uptime_kuma_compose.changed }}"

# Kuma 2 runs its database migrations on first start, which can take a
# minute on this VM. The healthcheck endpoint is not used: / answering 200 is
# the thing the operator and the LAN check need.
- name: Wait for Kuma to answer on the host
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ uptime_kuma_port }}/"
    status_code: 200
  register: uptime_kuma_local_check
  retries: 36
  delay: 5
  until: uptime_kuma_local_check.status == 200
  when: not ansible_check_mode
