---
# Two secrets that only ever matter on this host, so they are generated here
# once and never leave it. Neither is in 1Password or the vault. Losing the
# push token costs a redeploy. Losing the admin password while Kuma's data
# survives makes the bootstrap login check fail; set a new one with Kuma's own
# `docker exec -it uptime-kuma npm run reset-password` and write the same
# value to the file.
#
#   admin_password  Kuma's admin login. Mounted into both containers as a
#                   compose file secret: AutoKuma logs in with it, and the
#                   bootstrap script reads it inside the Kuma container. It
#                   never passes through an environment variable or a command
#                   line. The operator reads it with
#                   `sudo cat {{ uptime_kuma_secrets_dir }}/admin_password`.
#   nfs_push_token  Authorizes the NFS push monitor. Kuma requires exactly 32
#                   letters and digits. Given to the probe with systemd
#                   LoadCredential and templated into the monitor file.
#
# Generated with python3's secrets module, umask 077, written to a temp file
# and renamed, so a half-written value is never used.

- name: Create the Kuma secrets directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate the Kuma secrets once
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      python3 - "$DEST.tmp" "$KIND" <<'PY'
      import secrets, string, sys
      if sys.argv[2] == "nfs_push_token":
          alphabet = string.ascii_letters + string.digits
          value = "".join(secrets.choice(alphabet) for _ in range(32))
      else:
          value = secrets.token_urlsafe(32)
      with open(sys.argv[1], "w", encoding="ascii") as fh:
          fh.write(value + "\n")
      PY
      mv "$DEST.tmp" "$DEST"
    executable: /bin/bash
    creates: "{{ uptime_kuma_secrets_dir }}/{{ item }}"
  environment:
    DEST: "{{ uptime_kuma_secrets_dir }}/{{ item }}"
    KIND: "{{ item }}"
  loop:
    - admin_password
    - nfs_push_token

# A compose file secret is a bind mount that keeps the host file's owner and
# mode, and the two containers run as different uids. So the password file is
# group-readable by a gid that only those two containers get (group_add in
# compose.yaml). The push token is only read by root: systemd LoadCredential
# and Ansible.
- name: Set ownership of the Kuma secrets
  ansible.builtin.file:
    path: "{{ uptime_kuma_secrets_dir }}/{{ item.name }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: admin_password, group: "{{ uptime_kuma_secrets_gid }}", mode: '0440' }
    - { name: nfs_push_token, group: 0, mode: '0400' }
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

# Only the push token is needed here (it goes into the push monitor file).
# The admin password is never read by Ansible; the bootstrap script checks it
# inside the container.
- name: Read the NFS push token
  ansible.builtin.slurp:
    src: "{{ uptime_kuma_secrets_dir }}/nfs_push_token"
  register: uptime_kuma_push_token_file
  no_log: true
  when: not ansible_check_mode

- name: Keep the push token for the monitor file
  ansible.builtin.set_fact:
    uptime_kuma_nfs_push_token: "{{ uptime_kuma_push_token_file.content | b64decode | trim }}"
  no_log: true
  when: not ansible_check_mode

- name: Check the push token has the shape Kuma requires
  ansible.builtin.assert:
    that:
      - uptime_kuma_nfs_push_token is match('^[A-Za-z0-9]{32}$')
    fail_msg: >-
      {{ uptime_kuma_secrets_dir }}/nfs_push_token does not hold 32 letters
      and digits. Delete it and rerun to generate a new one.
    quiet: true
  when: not ansible_check_mode
