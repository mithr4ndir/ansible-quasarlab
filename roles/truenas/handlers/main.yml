---
- name: Reload systemd on truenas
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Run the zfs smart textfile exporter
  ansible.builtin.systemd:
    name: zfs-smart-textfile.service
    state: started
  become: true

- name: Restart the bay LED service
  ansible.builtin.systemd:
    name: bay-leds.service
    state: restarted
    daemon_reload: true
  become: true
  when: truenas_bay_leds_enabled | bool
