---
# TrueNAS SCALE is an appliance: / is read-only ZFS, Vector cannot be
# installed, and /usr is not writable. Everything here therefore works
# through paths the appliance already leaves writable, or through the
# middleware API (midclt), which stores config in TrueNAS's own database.

- name: Ensure the node_exporter textfile directory exists
  ansible.builtin.file:
    path: "{{ truenas_textfile_dir }}"
    state: directory
    mode: "1777"
  become: true

- name: Deploy the ZFS and SMART textfile exporter
  ansible.builtin.copy:
    src: zfs-smart-textfile.sh
    dest: "{{ truenas_exporter_dir }}/zfs-smart-textfile.sh"
    mode: "0755"
    owner: root
    group: root
  become: true
  notify: Run the zfs smart textfile exporter

- name: Deploy the textfile exporter systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  become: true
  loop:
    - zfs-smart-textfile.service
    - zfs-smart-textfile.timer
  notify:
    - Reload systemd on truenas
    - Run the zfs smart textfile exporter

- name: Enable and start the textfile exporter timer
  ansible.builtin.systemd:
    name: zfs-smart-textfile.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# ---------------------------------------------------------------------------
# Bay LEDs
#
# Each front-panel bay LED shows that disk's activity, amber when ZFS has
# counted errors on it or SMART cannot be read, and red when its vdev is not
# ONLINE, so the tray to pull is lit without anyone running the CLI by hand.
# Reads the exporter's textfile, so it never runs zpool or touches a drive.
# ---------------------------------------------------------------------------

- name: Install the UGREEN LED controller CLI
  ansible.builtin.get_url:
    url: "{{ truenas_ugreen_leds_cli_url }}"
    dest: "{{ truenas_exporter_dir }}/ugreen_leds_cli"
    checksum: "sha256:{{ truenas_ugreen_leds_cli_sha256 }}"
    mode: "0700"
    owner: root
    group: root
  become: true
  when: truenas_bay_leds_enabled | bool
  notify: Restart the bay LED service

- name: Deploy the bay LED script
  ansible.builtin.copy:
    src: bay-leds.sh
    dest: "{{ truenas_exporter_dir }}/bay-leds.sh"
    mode: "0755"
    owner: root
    group: root
  become: true
  when: truenas_bay_leds_enabled | bool
  notify: Restart the bay LED service

- name: Deploy the bay LED systemd unit
  ansible.builtin.template:
    src: bay-leds.service.j2
    dest: /etc/systemd/system/bay-leds.service
    mode: "0644"
    owner: root
    group: root
  become: true
  when: truenas_bay_leds_enabled | bool
  notify:
    - Reload systemd on truenas
    - Restart the bay LED service

- name: Enable and start the bay LED service
  ansible.builtin.systemd:
    name: bay-leds.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: truenas_bay_leds_enabled | bool

# ---------------------------------------------------------------------------
# SMART
#
# Five of eight tank drives (every Inland) had SMART disabled at the
# controller. smartctl reports "SMART Disabled" and returns no attributes, so
# smartd had nothing to act on and the TrueNAS alert page said "no alerts".
# Enabling is a single ATA SET FEATURES command and is idempotent, but this
# still checks first so a converged run reports no change.
# ---------------------------------------------------------------------------

- name: Discover attached SATA disks
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ls -1 /dev/sd? 2>/dev/null || true
    executable: /bin/bash
  register: truenas_sata_disks
  changed_when: false
  check_mode: false
  when: truenas_enable_smart | bool

- name: Check which disks have SMART disabled
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      smartctl -i {{ item }} 2>/dev/null | awk -F: '/SMART support is/{gsub(/^[ \t]+/,"",$2); print $2}' | tail -1
    executable: /bin/bash
  become: true
  register: truenas_smart_state
  changed_when: false
  check_mode: false
  loop: "{{ truenas_sata_disks.stdout_lines | default([]) }}"
  when: truenas_enable_smart | bool

- name: Enable SMART where it is off
  ansible.builtin.command:
    cmd: "smartctl -s on {{ item.item }}"
  become: true
  loop: "{{ truenas_smart_state.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - truenas_enable_smart | bool
    - item.stdout is defined
    - item.stdout | trim == 'Disabled'
  changed_when: true

# ---------------------------------------------------------------------------
# Remote syslog
#
# TrueNAS has no writable /etc for a syslog drop-in, but system.advanced holds
# the remote target in its own config database, which survives reboots and
# version upgrades. That makes midclt the durable option here, unlike the
# systemd units above.
# ---------------------------------------------------------------------------

- name: Read current TrueNAS advanced config
  ansible.builtin.command:
    cmd: midclt call system.advanced.config
  become: true
  register: truenas_advanced_raw
  changed_when: false
  check_mode: false

- name: Parse advanced config
  ansible.builtin.set_fact:
    truenas_advanced: "{{ truenas_advanced_raw.stdout | from_json }}"

- name: Point syslog at the vector aggregator
  ansible.builtin.command:
    cmd: >-
      midclt call system.advanced.update
      {{ {'syslogserver': truenas_syslog_server,
          'syslog_transport': truenas_syslog_transport,
          'sysloglevel': truenas_syslog_level} | to_json }}
  become: true
  when: >-
    truenas_advanced.syslogserver | default('') != truenas_syslog_server
    or truenas_advanced.syslog_transport | default('') != truenas_syslog_transport
    or truenas_advanced.sysloglevel | default('') != truenas_syslog_level
  changed_when: true

# ---------------------------------------------------------------------------
# UGREEN IT8613 Super I/O watchdog
#
# See defaults/main.yml for why this exists and how it was identified. Two
# persistence layers, neither redundant: the systemd unit runs early enough to
# beat the ~161s deadline, and the POSTINIT entry lives in the TrueNAS config
# database, which survives the version upgrade that wipes /etc.
#
# This role installs boot-time mechanisms rather than performing the register
# write itself, deliberately. If Ansible never runs again the NAS must still
# disarm its own watchdog on boot.
# ---------------------------------------------------------------------------

- name: Create the UGREEN watchdog directory
  ansible.builtin.file:
    path: "{{ truenas_wdt_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  when: truenas_wdt_disable_enabled | bool

# Writes to /dev/port, so root-only. 0700 matches what was hand-deployed and
# verified across a real reboot on 2026-09-20.
- name: Deploy the UGREEN watchdog disable script
  ansible.builtin.copy:
    src: ugreen-wdt-disable.py
    dest: "{{ truenas_wdt_script }}"
    mode: "0700"
    owner: root
    group: root
  become: true
  when: truenas_wdt_disable_enabled | bool

- name: Deploy the UGREEN watchdog systemd unit
  ansible.builtin.template:
    src: ugreen-wdt-disable.service.j2
    dest: "/etc/systemd/system/{{ truenas_wdt_service }}"
    mode: "0644"
    owner: root
    group: root
  become: true
  when: truenas_wdt_disable_enabled | bool
  notify: Reload systemd on truenas

- name: Enable and start the UGREEN watchdog disable service
  ansible.builtin.systemd:
    name: "{{ truenas_wdt_service }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: truenas_wdt_disable_enabled | bool

# The outcome, not the process state. The script exits non-zero if register
# 0x73 did not read back 0, and it refuses to write at all unless the chip
# identifies as 0x8613, so a zero exit status is the one thing that actually
# says the timer is disarmed. `active` alone would be satisfied by a unit that
# ran and failed to clear anything, which is precisely the shape of the Wazuh
# outage: every service reported healthy for four months while blind.
- name: Read the result of the watchdog disable
  ansible.builtin.command:
    cmd: "systemctl show -p ExecMainStatus --value {{ truenas_wdt_service }}"
  become: true
  changed_when: false
  check_mode: false
  register: truenas_wdt_exec_status
  when: truenas_wdt_disable_enabled | bool

- name: Assert the watchdog timer was actually cleared
  ansible.builtin.assert:
    that:
      - truenas_wdt_exec_status.stdout | trim == '0'
    fail_msg: >-
      {{ truenas_wdt_service }} exited
      {{ truenas_wdt_exec_status.stdout | default('(unknown)') | trim }}.
      The script exits non-zero when Super I/O register 0x73 does not read
      back 0, or when the chip does not identify as 0x8613. The watchdog is
      therefore still armed and this NAS will hard-reset in about three
      minutes. Check `journalctl -u {{ truenas_wdt_service }}`.
    quiet: true
  when: truenas_wdt_disable_enabled | bool

- name: Read the TrueNAS init and shutdown scripts
  ansible.builtin.command:
    cmd: midclt call initshutdownscript.query
  become: true
  register: truenas_initscripts_raw
  changed_when: false
  check_mode: false
  when: truenas_wdt_disable_enabled | bool

- name: Identify the POSTINIT entries that run the watchdog script
  ansible.builtin.set_fact:
    truenas_wdt_postinit: >-
      {{ (truenas_initscripts_raw.stdout | from_json)
         | selectattr('when', 'equalto', 'POSTINIT')
         | selectattr('command', 'equalto', truenas_wdt_script)
         | list }}
  when: truenas_wdt_disable_enabled | bool

# initshutdownscript.create is NOT idempotent: it appends unconditionally, so
# an unguarded task would add one entry per run and the hourly timer would
# accumulate them forever, each one executing on every boot. Duplicates are
# also the reason this asserts rather than silently using the first match.
- name: Assert at most one POSTINIT entry runs the watchdog script
  ansible.builtin.assert:
    that:
      - truenas_wdt_postinit | length <= 1
    fail_msg: >-
      {{ truenas_wdt_postinit | length }} POSTINIT entries already run
      {{ truenas_wdt_script }} (ids
      {{ truenas_wdt_postinit | map(attribute='id') | list | join(', ') }}).
      initshutdownscript.create appends without checking, so duplicates
      accumulate silently and every one of them runs at boot. Remove the
      extras with `midclt call initshutdownscript.delete <id>` and re-run.
    quiet: true
  when: truenas_wdt_disable_enabled | bool

- name: Register the watchdog disable as a TrueNAS POSTINIT command
  ansible.builtin.command:
    cmd: >-
      midclt call initshutdownscript.create
      {{ {'type': 'COMMAND',
          'command': truenas_wdt_script,
          'when': 'POSTINIT',
          'enabled': true,
          'timeout': truenas_wdt_postinit_timeout,
          'comment': truenas_wdt_postinit_comment} | to_json }}
  become: true
  when:
    - truenas_wdt_disable_enabled | bool
    - truenas_wdt_postinit | length == 0
  changed_when: true

# An entry that exists but is disabled is the failure this would otherwise
# miss: present in the query, so no duplicate is created, and inert at boot.
- name: Re-enable the watchdog POSTINIT entry if it was switched off
  ansible.builtin.command:
    cmd: >-
      midclt call initshutdownscript.update
      {{ truenas_wdt_postinit[0].id }}
      {{ {'enabled': true} | to_json }}
  become: true
  when:
    - truenas_wdt_disable_enabled | bool
    - truenas_wdt_postinit | length == 1
    - not (truenas_wdt_postinit[0].enabled | default(false) | bool)
  changed_when: true
