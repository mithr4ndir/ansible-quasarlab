---
# Install the Python parser helper in a stable path. Parser has zero
# non-stdlib deps so no venv is needed.
- name: Ensure parser install directory exists
  ansible.builtin.file:
    path: /usr/local/lib/op-quota-collector
    state: directory
    owner: root
    group: root
    mode: '0755'

# Code file changes do not notify handlers. The collector is a oneshot
# service triggered by the timer; the next scheduled fire picks up new
# code automatically. See handlers/main.yml for policy rationale.
- name: Install parse.py helper
  ansible.builtin.copy:
    src: parse.py
    dest: "{{ op_quota_parser }}"
    owner: root
    group: root
    mode: '0755'

- name: Install shared op-killswitch.sh library
  ansible.builtin.copy:
    src: op-killswitch.sh
    dest: "{{ op_quota_killswitch_lib }}"
    owner: root
    group: root
    mode: '0755'

- name: Install attribution.py helper
  ansible.builtin.copy:
    src: attribution.py
    dest: "{{ op_quota_attribution }}"
    owner: root
    group: root
    mode: '0755'

# The shim log and the attribution state are owned by the collector user:
# the timer rotates the log and rewrites the state as that user. 0750/0640
# because op:// references and parent command lines are not for every
# local account.
- name: Ensure op shim log directory exists
  ansible.builtin.file:
    path: "{{ op_quota_shim_log | dirname }}"
    state: directory
    owner: "{{ op_quota_user }}"
    group: "{{ op_quota_user }}"
    mode: '0750'

- name: Ensure attribution state directory exists
  ansible.builtin.file:
    path: "{{ op_quota_attribution_state_dir }}"
    state: directory
    owner: "{{ op_quota_user }}"
    group: "{{ op_quota_user }}"
    mode: '0750'

# Only shadow op when the real binary is there. Otherwise `command -v op`
# would find the shim and callers would get exit 127 instead of their
# "op unavailable" branch. follow: a dangling symlink is no binary.
- name: Check for the real op binary
  ansible.builtin.stat:
    path: "{{ op_quota_real_op }}"
    follow: true
  register: op_quota_real_op_stat

- name: Install op attribution shim ahead of the real op on PATH
  ansible.builtin.copy:
    src: op-shim
    dest: "{{ op_quota_shim_path }}"
    owner: root
    group: root
    mode: '0755'
  when:
    - op_quota_shim_enabled | bool
    - op_quota_real_op_stat.stat.exists

# Exactly one of install and remove runs. Removal also covers a real op
# that has gone away since an earlier run installed the shim, which would
# otherwise be left behind to fail every call with 127.
- name: Remove op attribution shim when disabled or the real op is gone
  ansible.builtin.file:
    path: "{{ op_quota_shim_path }}"
    state: absent
  when: not (op_quota_shim_enabled | bool) or not op_quota_real_op_stat.stat.exists

- name: Install collector script
  ansible.builtin.template:
    src: op-quota-collector.sh.j2
    dest: /usr/local/bin/op-quota-collector.sh
    owner: root
    group: root
    mode: '0755'

- name: Install systemd service unit
  ansible.builtin.template:
    src: op-quota-collector.service.j2
    dest: /etc/systemd/system/op-quota-collector.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload-systemd

- name: Install systemd timer unit
  ansible.builtin.template:
    src: op-quota-collector.timer.j2
    dest: /etc/systemd/system/op-quota-collector.timer
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload-systemd
    - restart-op-quota-collector-timer

- name: Flush handlers so timer is reloaded before we enable it
  ansible.builtin.meta: flush_handlers

- name: Enable and start collector timer
  ansible.builtin.systemd:
    name: op-quota-collector.timer
    enabled: true
    state: started

# Prime run so Prometheus has data on the very next scrape. Runs as the
# collector user (not root) to match production execution context.
#
# Gated on absence of the metric file so repeated playbook runs do NOT burn
# a 1Password quota read every time. The systemd timer takes over on schedule.
#
# `failed_when: false` is intentional here: the collector script always
# exits 0 by design, surfacing failure through the
# `onepassword_ratelimit_collector_success` gauge rather than a non-zero
# exit code.
- name: Check for existing metric file
  ansible.builtin.stat:
    path: "{{ op_quota_metric_file }}"
  register: op_quota_metric_stat

- name: Prime first collector run
  ansible.builtin.command: /usr/local/bin/op-quota-collector.sh
  become: true
  become_user: "{{ op_quota_user }}"
  changed_when: false
  failed_when: false
  when: not op_quota_metric_stat.stat.exists
