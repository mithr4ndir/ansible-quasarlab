---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Wazuh GPG key
  ansible.builtin.shell:
    cmd: curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --dearmor -o /usr/share/keyrings/wazuh.gpg
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    filename: wazuh
    state: present

- name: Download wazuh-certs-tool
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/{{ wazuh_version }}/wazuh-certs-tool.sh
    dest: /tmp/wazuh-certs-tool.sh
    mode: '0755'

- name: Create certs config
  ansible.builtin.template:
    src: certs-config.yml.j2
    dest: /tmp/config.yml
    mode: '0644'

- name: Generate Wazuh certificates
  ansible.builtin.command:
    cmd: /tmp/wazuh-certs-tool.sh --all
    chdir: /tmp
    creates: /tmp/wazuh-certificates/root-ca.pem

- name: Install Wazuh Indexer
  ansible.builtin.apt:
    name: wazuh-indexer
    state: present
    update_cache: true

- name: Create indexer certs directory
  ansible.builtin.file:
    path: /etc/wazuh-indexer/certs
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0500'

- name: Copy indexer certificates
  ansible.builtin.shell:
    cmd: |
      cp /tmp/wazuh-certificates/wazuh-indexer.pem /tmp/wazuh-certificates/wazuh-indexer-key.pem /tmp/wazuh-certificates/root-ca.pem /tmp/wazuh-certificates/admin.pem /tmp/wazuh-certificates/admin-key.pem /etc/wazuh-indexer/certs/
      chown -R wazuh-indexer:wazuh-indexer /etc/wazuh-indexer/certs
      chmod 400 /etc/wazuh-indexer/certs/*
    creates: /etc/wazuh-indexer/certs/root-ca.pem

- name: Configure Wazuh Indexer
  ansible.builtin.template:
    src: indexer-opensearch.yml.j2
    dest: /etc/wazuh-indexer/opensearch.yml
    mode: '0660'
    owner: wazuh-indexer
    group: wazuh-indexer
  notify: Restart wazuh-indexer

- name: Enable and start Wazuh Indexer
  ansible.builtin.systemd:
    name: wazuh-indexer
    enabled: true
    state: started

- name: Wait for Wazuh Indexer to be ready
  ansible.builtin.wait_for:
    port: "{{ wazuh_indexer_port }}"
    delay: 10
    timeout: 120

- name: Check if Wazuh Indexer security is already initialized
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ wazuh_indexer_port }}/.opendistro_security"
    method: GET
    user: admin
    password: admin
    validate_certs: false
    force_basic_auth: true
    status_code: [200, 401, 403]
  register: security_check
  failed_when: false
  changed_when: false

- name: Initialize Wazuh Indexer security
  ansible.builtin.command:
    cmd: /usr/share/wazuh-indexer/bin/indexer-security-init.sh
  register: security_init
  changed_when: security_init.rc == 0
  failed_when: false
  when: security_check.status is not defined or security_check.status == -1

- name: Install Wazuh Manager
  ansible.builtin.apt:
    name: wazuh-manager
    state: present

- name: Configure Wazuh Manager
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    mode: '0660'
    owner: root
    group: wazuh
  notify: Restart wazuh-manager

- name: Create custom rules directory
  ansible.builtin.file:
    path: /var/ossec/etc/rules
    state: directory
    owner: root
    group: wazuh
    mode: '0750'

- name: Deploy custom rules
  ansible.builtin.copy:
    src: local_rules.xml
    dest: /var/ossec/etc/rules/local_rules.xml
    owner: root
    group: wazuh
    mode: '0660'
  notify: Restart wazuh-manager

- name: Create integrations directory
  ansible.builtin.file:
    path: /var/ossec/integrations
    state: directory
    owner: root
    group: wazuh
    mode: '0750'

- name: Deploy Alertmanager integration script
  ansible.builtin.copy:
    src: custom-alertmanager.py
    dest: /var/ossec/integrations/custom-alertmanager
    owner: root
    group: wazuh
    mode: '0750'

- name: Enable and start Wazuh Manager
  ansible.builtin.systemd:
    name: wazuh-manager
    enabled: true
    state: started

- name: Add vector user to wazuh group for alert log access
  ansible.builtin.user:
    name: vector
    groups: wazuh
    append: true
  failed_when: false
  notify: Restart vector

- name: Ensure Wazuh alerts log directory is group-readable
  ansible.builtin.file:
    path: /var/ossec/logs/alerts
    mode: '0750'
    owner: wazuh
    group: wazuh
  failed_when: false

# The ELK decommission (2026-03-15) left the Elastic 8.x apt repo behind on this
# host with no elasticsearch/kibana/logstash package still installed. It kept
# offering newer Filebeat, and a routine `apt upgrade` walked 7.10.2 -> 8.19.14 on
# 2026-04-10 01:34. Wazuh 4.x requires Filebeat OSS 7.10.2; 8.x cannot talk to
# OpenSearch (it probes `_license`, which OpenSearch rejects with a 400). Alert
# indexing stopped that minute and stayed broken for ~4 months while every
# service kept reporting `active`.
#
# The orphaned repo itself is removed fleet-wide by
# roles/unattended_upgrades/tasks/decommissioned_apt_sources.yml, which reaches
# this host through playbooks/vm_baseline.yml and playbooks/monitoring.yml. The
# pinned install and the hold below stay here because they are Wazuh specific.

- name: Check installed Filebeat version
  ansible.builtin.command:
    cmd: dpkg-query -W -f=${Version} filebeat
  register: filebeat_installed
  changed_when: false
  failed_when: false

# Installed from a pinned .deb rather than apt: Wazuh 4.x needs the OSS build at
# exactly this version and it is not carried in any repo configured here.
- name: Download pinned Filebeat OSS package
  ansible.builtin.get_url:
    url: "{{ wazuh_filebeat_deb_url }}"
    dest: /tmp/filebeat-oss-{{ wazuh_filebeat_version }}.deb
    mode: '0644'
  when: filebeat_installed.stdout != wazuh_filebeat_version

- name: Install pinned Filebeat OSS
  ansible.builtin.apt:
    deb: /tmp/filebeat-oss-{{ wazuh_filebeat_version }}.deb
    force: true
  when: filebeat_installed.stdout != wazuh_filebeat_version
  notify: Restart filebeat

# Without this, any `apt upgrade` re-breaks alert indexing. Note that
# unattended-upgrades was never the culprit: its Allowed-Origins is distro-only
# and it already blacklists the wazuh-* packages. A routine manual upgrade is
# enough, so the hold is the control that actually matters.
- name: Hold Filebeat at the pinned version
  ansible.builtin.dpkg_selections:
    name: filebeat
    selection: hold

- name: Download Wazuh Filebeat config
  ansible.builtin.get_url:
    url: "https://packages.wazuh.com/{{ wazuh_version }}/tpl/wazuh/filebeat/filebeat.yml"
    dest: /etc/filebeat/filebeat.yml
    mode: '0644'

- name: Download Wazuh Filebeat module
  ansible.builtin.shell:
    cmd: "curl -s https://packages.wazuh.com/4.x/filebeat/wazuh-filebeat-0.4.tar.gz | tar -xvz -C /usr/share/filebeat/module"
    creates: /usr/share/filebeat/module/wazuh

- name: Create Filebeat certs directory
  ansible.builtin.file:
    path: /etc/filebeat/certs
    state: directory
    owner: root
    group: root
    mode: '0500'

- name: Copy Filebeat certificates
  ansible.builtin.shell:
    cmd: |
      cp /tmp/wazuh-certificates/wazuh-manager.pem /tmp/wazuh-certificates/wazuh-manager-key.pem /tmp/wazuh-certificates/root-ca.pem /etc/filebeat/certs/
      chmod 400 /etc/filebeat/certs/*
    creates: /etc/filebeat/certs/root-ca.pem

- name: Set Filebeat output to local indexer
  ansible.builtin.lineinfile:
    path: /etc/filebeat/filebeat.yml
    regexp: '^  hosts:'
    line: "  hosts: [\"127.0.0.1:{{ wazuh_indexer_port }}\"]"

- name: Enable and start Filebeat
  ansible.builtin.systemd:
    name: filebeat
    enabled: true
    state: started
  notify: Restart filebeat

- name: Install Wazuh Dashboard
  ansible.builtin.apt:
    name: wazuh-dashboard
    state: present

- name: Create dashboard certs directory
  ansible.builtin.file:
    path: /etc/wazuh-dashboard/certs
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: '0500'

- name: Copy dashboard certificates
  ansible.builtin.shell:
    cmd: |
      cp /tmp/wazuh-certificates/wazuh-dashboard.pem /tmp/wazuh-certificates/wazuh-dashboard-key.pem /tmp/wazuh-certificates/root-ca.pem /etc/wazuh-dashboard/certs/
      chown -R wazuh-dashboard:wazuh-dashboard /etc/wazuh-dashboard/certs
      chmod 400 /etc/wazuh-dashboard/certs/*
    creates: /etc/wazuh-dashboard/certs/root-ca.pem

- name: Configure Wazuh Dashboard
  ansible.builtin.template:
    src: dashboard-opensearch-dashboards.yml.j2
    dest: /etc/wazuh-dashboard/opensearch_dashboards.yml
    mode: '0660'
    owner: wazuh-dashboard
    group: wazuh-dashboard
  notify: Restart wazuh-dashboard

- name: Enable and start Wazuh Dashboard
  ansible.builtin.systemd:
    name: wazuh-dashboard
    enabled: true
    state: started

- name: Wait for Wazuh Dashboard to be ready
  ansible.builtin.wait_for:
    port: "{{ wazuh_dashboard_port }}"
    delay: 15
    timeout: 120

- name: Check if indexer admin password is already set
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ wazuh_indexer_port }}/_cluster/health"
    method: GET
    user: admin
    password: "{{ wazuh_admin_password }}"
    validate_certs: false
    force_basic_auth: true
    status_code: [200]
  register: password_check
  failed_when: false
  changed_when: false
  no_log: true
  when: wazuh_admin_password is defined

- name: Change indexer admin password
  ansible.builtin.shell:
    cmd: >
      /usr/share/wazuh-indexer/plugins/opensearch-security/tools/wazuh-passwords-tool.sh
      -u admin -p '{{ wazuh_admin_password }}'
  no_log: true
  changed_when: true
  when:
    - wazuh_admin_password is defined
    - password_check.status is not defined or password_check.status != 200

- name: Change Wazuh API password
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ wazuh_api_port }}/security/users/1"
    method: PUT
    user: wazuh
    password: wazuh
    body_format: json
    body:
      password: "{{ wazuh_api_password }}"
    validate_certs: false
    force_basic_auth: true
    status_code: [200]
  no_log: true
  when: wazuh_api_password is defined
  failed_when: false

# Agents declare their groups at enrollment via <groups> in the agent ossec.conf.
# authd validates every name against groups that already exist on the manager and
# rejects the whole enrollment if any one is missing, with
# "wazuh-authd: ERROR: Invalid group: <name>".
#
# The agent then logs only "Unable to connect to any server", which reads like a
# network or firewall problem and says nothing about groups. The manager keeps
# running and the dashboard keeps working, so nothing looks broken while no host
# telemetry is collected at all. That is exactly what happened on 2026-08-06:
# 13 agents had been retrying with an empty client.keys on the manager.
#
# Creating the groups here keeps agent-side and manager-side definitions from
# drifting apart again.
- name: Ensure agent groups exist on the manager
  ansible.builtin.command:
    cmd: /var/ossec/bin/agent_groups -a -g {{ item }} -q
    creates: /var/ossec/etc/shared/{{ item }}
  loop: "{{ wazuh_manager_agent_groups }}"

- name: Verify no agent enrollment is being rejected for a missing group
  ansible.builtin.command:
    cmd: grep -c 'Invalid group' /var/ossec/logs/ossec.log
  register: wazuh_invalid_group_count
  changed_when: false
  failed_when: false

- name: Warn when agents are still failing to enroll
  ansible.builtin.debug:
    msg: >-
      {{ wazuh_invalid_group_count.stdout }} 'Invalid group' rejections in
      ossec.log. Agents are failing to enroll. Compare wazuh_manager_agent_groups
      against every wazuh_agent_groups value in group_vars.
  when:
    - wazuh_invalid_group_count.stdout is defined
    - wazuh_invalid_group_count.stdout | int > 0
