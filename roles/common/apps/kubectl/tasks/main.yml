- name: Set short version for URL
  ansible.builtin.set_fact:
    kubectl_short_version: "{{ kube_version.split('.')[0] }}.{{ kube_version.split('.')[1] }}"

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Kubernetes APT signing key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v{{ kubectl_short_version }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    mode: '0644'

- name: Check if key is ASCII-armored
  ansible.builtin.shell: grep -q "BEGIN PGP PUBLIC KEY BLOCK" /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  register: key_format_check
  failed_when: false
  changed_when: false

- name: Convert to binary if ASCII-armored
  ansible.builtin.shell: |
    gpg --dearmor < /etc/apt/keyrings/kubernetes-apt-keyring.gpg > /etc/apt/keyrings/kubernetes-apt-keyring.gpg.tmp
    mv /etc/apt/keyrings/kubernetes-apt-keyring.gpg.tmp /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: key_format_check.rc == 0
  become: true

- name: Add the Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ kubectl_short_version }}/deb/ /
    filename: kubernetes
    state: present
    update_cache: true
  register: repo_added

# kubectl is held (and kubeadm/kubelet too, on hosts that carry those marks), so
# a version change needs --allow-change-held-packages. That flag is not scoped to
# the named package: if apt ever decided a dependency change was needed, it would
# silently move other held packages too. Simulate first and refuse unless kubectl
# is the only package apt would install, remove or purge. Read-only, so it also
# runs under --check.
- name: Refuse unless kubectl is the only package the pinned install would change
  ansible.builtin.shell: |
    set -o pipefail
    LC_ALL=C apt-get --simulate install "kubectl=${KUBE_VERSION}" --allow-change-held-packages \
      | awk '/^(Inst|Remv|Purg) / && $2 !~ /^kubectl(:[a-z0-9]+)?$/ { print "would change: " $0; bad = 1 }
             END { exit bad }'
  args:
    executable: /bin/bash
  environment:
    KUBE_VERSION: "{{ kube_version }}"
  register: kubectl_install_simulation
  changed_when: false
  check_mode: false
  become: true

- name: Install kubectl at the pinned cluster version
  become: true
  block:
    - name: Install kubectl (hold is overridden for this package only)
      ansible.builtin.apt:
        name:
          - "kubectl={{ kube_version }}"
        state: present
        allow_change_held_packages: true
        update_cache: false
  always:
    # In `always` so the hold is reasserted even if the install fails part way.
    # kubeadm and kubelet holds are deliberately left alone.
    - name: Hold kubectl
      ansible.builtin.dpkg_selections:
        name: kubectl
        selection: hold

- name: Add kubectl alias to bashrc
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    line: 'alias k=kubectl'
    create: true
    mode: '0644'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: false
  run_once: true
