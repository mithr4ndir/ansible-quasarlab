---
# Baseline packages every VM should have
vm_baseline_packages:
  - qemu-guest-agent
  - curl
  - jq
  - htop
  - net-tools
  - rsyslog

# NTP — chrony preferred over systemd-timesyncd
vm_baseline_ntp_package: chrony

# Sysctl tuning (vm.swappiness excluded — K8s nodes have swap off,
# non-K8s VMs use group_vars to override if needed)
vm_baseline_sysctl:
  net.core.somaxconn: 1024
  net.ipv4.tcp_tw_reuse: 1

# Thread ceiling.
#
# Every VM in this lab runs with Proxmox memory hotplug (hotplug=...,memory in
# the VM config, which PVE only honours with numa=1). PVE implements that by
# booting the guest with 1 GiB of static RAM and hot-adding the rest as virtual
# DIMMs. The kernel sizes kernel.threads-max once, during early boot, from the
# memory it can see at that moment, and never recomputes it when memory is
# hot-added. So a 16 GiB VM boots with the thread ceiling of a 1 GiB one:
#
#   command-center1  16 GiB, memory hotplug     threads-max  6847
#   k8cluster1       16 GiB, memory hotplug     threads-max  6848
#   pbs1              4 GiB, no memory hotplug  threads-max 31240
#   npm               6 GiB, no memory hotplug  threads-max 47094
#
# Everything derived from it inherits the mistake, because systemd resolves its
# percentages against threads-max: DefaultTasksMax=15% lands at 1027 per unit,
# user-.slice TasksMax=33% at 2259, and the kernel's own default RLIMIT_NPROC
# (max_threads / 2) at 3423. On 2026-09-21 herdr.service crossed the 1027 and
# died with 'failed to spawn thread: Os { code: 11, kind: WouldBlock }'.
#
# This restores what the running RAM warrants, using the kernel's own formula
# (mempages / 32, i.e. MemTotal_kB / 128, i.e. MemTotal_MB * 8). It only ever
# raises the value: on a VM that did boot with all its RAM the result is within
# a percent of what the kernel already chose.
#
# It is a ceiling, not an allocation. Nothing is reserved by raising it.
#
# The real fix is upstream in terraform-quasarlab: drop `memory` from the
# hotplug string so the guest boots with its full RAM. That needs a cold boot
# per VM, so this stays as the thing that holds regardless.
vm_baseline_threads_max: "{{ (ansible_memtotal_mb | int) * 8 }}"

# journald disk usage.
#
# journald ships uncapped by default, and it shows: on 2026-08-24 a survey of
# the fleet found every VM unbounded, with jellyfin at 4.0G, k8cluster2 at 3.9G
# and k8cluster3 at 2.5G -- roughly 14GB of journal across six hosts. On
# jellyfin, whose root is only 51GB and is shared with the Jellyfin transcode
# cache, that was headroom the cache needed during a busy watch party.
#
# Override per host or group where a bigger journal is genuinely wanted.
vm_baseline_journald_max_use: 500M
vm_baseline_journald_max_file_size: 50M

# Public keys allowed to log in as the ansible user on every managed VM.
# These are PUBLIC keys: safe in git, and the private halves never leave the
# operator's machines. Managed here rather than left to cloud-init, because
# cloud-init only seeds them at build time: a VM built before a key existed
# never gets it. On 2026-09-19 uptime-kuma, musicbot and jellyfin were all
# missing the ed25519 key for that reason, and no amount of re-running the
# playbooks would have fixed it.
vm_baseline_authorized_keys:
  - "ssh-rsa  cwladino@outlook.com"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKcVvSNFs6L9IKRS3pY0Bux+KG5XNKWpMgRvUqeQLeCl cwladino@outlook.com"
# Never true here: exclusive would fight cloud-init and lock out any key added
# out of band. Keys are added, never removed.
vm_baseline_authorized_keys_exclusive: false
