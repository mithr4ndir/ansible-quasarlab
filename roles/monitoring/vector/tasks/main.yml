---
- name: Remove stale Vector GPG keyring (if empty from failed install)
  ansible.builtin.file:
    path: /usr/share/keyrings/vector-archive-keyring.gpg
    state: absent
  when: ansible_local.vector_keyring_valid is not defined

# A minimal cloud image has neither. Without gpg the key task fails outright
# (seen on uptime-kuma, 2026-09-19); without pipefail a failed download still
# writes an empty keyring, which is what the cleanup task above exists for.
- name: Install prerequisites for the Vector repository key
  ansible.builtin.apt:
    name:
      - gnupg
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Datadog GPG keys for Vector
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      curl -fsSL https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public | gpg --dearmor -o /usr/share/keyrings/datadog-archive-keyring.gpg
      curl -fsSL https://keys.datadoghq.com/DATADOG_APT_KEY_F14F620E.public | gpg --dearmor -o /usr/share/keyrings/datadog-archive-keyring-f14f620e.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/datadog-archive-keyring.gpg

- name: Add Vector repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/datadog-archive-keyring.gpg] https://apt.vector.dev/ stable vector-0"
    filename: vector
    state: present

- name: Pin Vector to the tested version
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/vector
    content: |
      # Managed by Ansible. Do not edit manually.
      # See roles/monitoring/vector/defaults/main.yml for why this is pinned.
      Package: vector
      Pin: version {{ vector_version }}
      Pin-Priority: 1001
    owner: root
    group: root
    mode: '0644'

# allow_downgrade so a host that has already drifted forward is brought back to
# the pinned version rather than silently staying broken.
- name: Install Vector
  ansible.builtin.apt:
    name: "vector={{ vector_version }}"
    state: present
    allow_downgrade: true
    update_cache: true

- name: Add vector user to adm group for log access
  ansible.builtin.user:
    name: vector
    groups: adm
    append: true
  notify: Restart vector

- name: Configure Vector
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: /etc/vector/vector.yaml
    mode: '0644'
  notify: Restart vector

- name: Enable and start Vector
  ansible.builtin.systemd:
    name: vector
    enabled: true
    state: started
