---
node_exporter_version: "1.7.0"
node_exporter_port: 9100
node_exporter_install_dir: /usr/local/bin
node_exporter_textfile_dir: /var/lib/node_exporter/textfiles

# Systemd service monitoring (disabled by default)
node_exporter_systemd_enabled: false
node_exporter_systemd_units: []

# Units every host gets on top of its per-group/per-host list. The group lists
# fully override rather than merge, so anything fleet-wide has to live here or
# it silently drops off most hosts. The apt units are here because on
# 2026-08-12 pve's apt-daily.service sat in "activating" for 10 days with no
# alert: the unit was simply not in any scrape list, so a state-based rule
# would have been vacuous.
node_exporter_systemd_units_baseline:
  - apt-daily.service
  - apt-daily-upgrade.service
