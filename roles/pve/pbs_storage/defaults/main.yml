---
# Registers the PBS datastore as a PVE storage and points the cluster backup
# job at it. The PBS side (datastore, retention, verification) is roles/pbs.

pbs_storage_id: pbs-lab
pbs_storage_server: 192.168.1.61
pbs_storage_datastore: lab
pbs_storage_tokenid: "pve@pbs!pve"

# PBS presents a self-signed cert, so PVE pins it by fingerprint. Read from
# `proxmox-backup-manager cert info` on pbs1. If pbs1 is rebuilt, this changes
# and every backup fails with a TLS error until it is updated.
pbs_storage_fingerprint: >-
  c5:91:53:91:3f:fc:06:10:af:b8:a7:12:f1:0a:41:a1:a7:7c:b6:75:1b:4e:99:4b:46:33:d7:3d:4f:d6:8e:0a

# Secret comes from the env, populated from 1Password item
# "PBS pve@pbs!pve token" in the Infrastructure vault. Never inline it here:
# this repo is public.
pbs_storage_token_env: PBS_TOKEN_SECRET

# The cluster backup job. Reuses the EXISTING job id rather than adding a
# second one, because the old job still points at the decommissioned
# `nas-backup` and is disabled. Updating it in place avoids two jobs competing.
pbs_backup_job_id: "99a51b34-59e4-4fde-aab1-912f7c309112"
pbs_backup_schedule: "hourly"
pbs_backup_mode: snapshot
# Exclusions. The job is `all 1`, so anything not excluded gets backed up.
#
# The PBS servers must be excluded. vm103 (pbs1) is the backup TARGET, so
# backing it up to itself is circular, and it demonstrably fails every run:
#   ERROR: VM 103 qmp command 'backup' failed - backup connect failed:
#          command error: http upgrade request timed out
# pbs1 is saturated hashing chunks at the moment it is also asked to be the
# destination. A job that is red every hour trains you to ignore it, which is
# worse than no job. vm120 (pbs2) is the replica, and holds a second copy of
# the same chunks, so backing it up would store the backups inside the backups.
# Both PBS guests are rebuildable from roles/pbs plus terraform, and the
# datastore itself is the thing with the value.
pbs_backup_exclude_pbs_vmids: [103, 120]

# Templates are static and reproducible from scripts/build-cloud-template.sh,
# so backing them up hourly is wasted read I/O on a pool that currently has a
# vdev running ~50x the latency of its siblings. Discovered from the live
# cluster rather than hardcoded, so a new template is excluded automatically.
pbs_backup_exclude_templates: true

# Anything else, by vmid. vm9000 carries backup=0 on its disk, which makes
# vzdump report success while producing a useless archive, so it must never be
# relied on. It is also a template, so it is covered twice on purpose.
# See feedback_pve_disk_backup_flag_vacuous.
#
# vm122 (win-gputest) cannot be backed up at all while vm121 (llm1) is running.
# Both are configured with `hostpci0: 0000:0a:00`, the RTX 2080 Ti. vzdump has
# to start a STOPPED guest (paused) to attach its disks to a backup block job,
# and that start claims the passthrough device, so it fails against whichever
# of the two is already holding the card:
#   ERROR: PCI device '0000:0a:00.0' already in use by VMID '121'
#   ERROR: Backup of VM 122 failed - PCI device '0000:0a:00.0' already in use
# One guest failing makes the whole cluster job exit `job errors`, which PVE
# raises as a severity-error notification. That reached Discord once a day
# 2026-10-16 through 2026-10-19, every run since vm122 was created. Under the
# old hourly schedule it would have been 24 a day.
#
# This is an exclusion rather than a fix because the failure is structural: two
# guests cannot share one PCI device, and win-gputest is a scratch Windows VM
# built to prove the 2080 Ti faulty, which it did. Delete the guest and this
# entry goes with it. If it is ever kept and wanted in the backup set, drop
# `hostpci0` from its config while it is idle; do NOT set backup=0 on its
# disks, which reports success and writes a useless archive.
pbs_backup_exclude_vmids: [9000, 122]
# Retention is deliberately NOT set on the PVE job. PBS owns it via its own
# hourly prune job (roles/pbs: keep 24/7/4/3), so setting it here too would
# mean two policies pruning the same datastore, and would additionally require
# granting Datastore.Prune to the PVE token. One enforcing side is correct.

# pvesm cannot read a storage's password back, so drift in the SECRET is not
# detectable. The readable fields (server, username, fingerprint, content) are
# reconciled every run. Set this true for one run to push the credential again,
# which is what a PBS rebuild or token rotation needs: the fingerprint changes
# with the certificate and every backup then fails on TLS.
pbs_storage_refresh_credentials: false
