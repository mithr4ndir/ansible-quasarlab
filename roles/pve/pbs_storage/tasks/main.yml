---
- name: Assert the PBS token secret is present in the environment
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.assert:
    that:
      - lookup('env', pbs_storage_token_env) | length > 0
    fail_msg: >-
      {{ pbs_storage_token_env }} is empty or unset. It holds the
      `{{ pbs_storage_tokenid }}` secret from the 1Password item
      "PBS pve@pbs!pve token" (Infrastructure vault). Export it, or run via a
      wrapper that does. A `| mandatory` lookup would pass an empty string
      through silently, which is why this is an explicit assert.
    quiet: true

# `pvesm status` has no --output-format; pvesh does, and /storage lists the
# cluster-wide configured storages rather than per-node availability, which is
# what "is this storage already registered" actually means.
- name: Read the configured storages
  ansible.builtin.command: pvesh get /storage --output-format json
  changed_when: false
  check_mode: false
  run_once: true
  register: pbs_pvesm

- name: Register the PBS datastore as a PVE storage
  ansible.builtin.command:
    argv:
      - pvesm
      - add
      - pbs
      - "{{ pbs_storage_id }}"
      - --server
      - "{{ pbs_storage_server }}"
      - --datastore
      - "{{ pbs_storage_datastore }}"
      - --username
      - "{{ pbs_storage_tokenid }}"
      - --password
      - "{{ lookup('env', pbs_storage_token_env) }}"
      - --fingerprint
      - "{{ pbs_storage_fingerprint | trim }}"
      - --content
      - backup
  # pvesm writes the secret to /etc/pve/priv/storage/<id>.pw, not to
  # storage.cfg, so it does not land in the cluster config. Keep it out of the
  # ansible log all the same.
  no_log: true
  when: pbs_storage_id not in
        ((pbs_pvesm.stdout | from_json) | map(attribute='storage') | list)
  run_once: true
  register: pbs_storage_added

# An ID that exists is not a storage that is CORRECT. Adding it only when the
# ID is absent means a changed server, token, datastore or fingerprint leaves
# PVE talking to the old endpoint, and the job assertions below still pass
# because they only inspect the job. The documented PBS rebuild case makes this
# concrete: the certificate fingerprint changes and every backup fails on TLS
# while this role reports success.
- name: Read the live PBS storage config
  ansible.builtin.command: pvesh get /storage/{{ pbs_storage_id }} --output-format json
  changed_when: false
  check_mode: false
  run_once: true
  register: pbs_storage_live_raw

- name: Record the live PBS storage config
  ansible.builtin.set_fact:
    pbs_storage_live: "{{ pbs_storage_live_raw.stdout | from_json }}"
  run_once: true

# `datastore` is create-only on a pbs storage, so a mismatch cannot be fixed by
# `pvesm set`. Fail rather than silently back up to the wrong datastore.
- name: Assert the existing storage points at the intended datastore
  run_once: true
  ansible.builtin.assert:
    that:
      - pbs_storage_live.datastore == pbs_storage_datastore
      - pbs_storage_live.server == pbs_storage_server
    fail_msg: >-
      Storage '{{ pbs_storage_id }}' targets
      {{ pbs_storage_live.server }}/{{ pbs_storage_live.datastore }}, not
      {{ pbs_storage_server }}/{{ pbs_storage_datastore }}. PVE treats both
      `server` and `datastore` as fixed parameters on a pbs storage, so neither
      can be changed in place; remove and re-add it deliberately.
    quiet: true

- name: Reconcile the PBS storage endpoint and credentials
  ansible.builtin.command:
    argv:
      - pvesm
      - set
      - "{{ pbs_storage_id }}"
      # --server is NOT passed. PVE treats it as a fixed parameter on a pbs
      # storage and rejects it even when the value is unchanged:
      #   update storage failed: can't change value of fixed parameter 'server'
      # It appears in the PUT schema from `pvesh usage`, which is misleading.
      # A server change needs a deliberate remove and re-add, so it is asserted
      # as immutable below rather than reconciled.
      - --username
      - "{{ pbs_storage_tokenid }}"
      - --password
      - "{{ lookup('env', pbs_storage_token_env) }}"
      - --fingerprint
      - "{{ pbs_storage_fingerprint | trim }}"
      - --content
      - backup
  no_log: true
  run_once: true
  when: >-
    pbs_storage_refresh_credentials | bool
    or pbs_storage_live.username | default('') != pbs_storage_tokenid
    or pbs_storage_live.fingerprint | default('') != (pbs_storage_fingerprint | trim)
    or pbs_storage_live.content | default('') != 'backup'

- name: Re-read the storage config after reconciliation
  ansible.builtin.command: pvesh get /storage/{{ pbs_storage_id }} --output-format json
  changed_when: false
  check_mode: false
  run_once: true
  register: pbs_storage_after

# Asserting the end state for the same reason the PBS role does: pvesm set
# returns 0 whether or not the values landed as intended.
- name: Assert the storage endpoint now matches the intent
  run_once: true
  ansible.builtin.assert:
    that:
      - (pbs_storage_after.stdout | from_json).server == pbs_storage_server
      - (pbs_storage_after.stdout | from_json).username == pbs_storage_tokenid
      - (pbs_storage_after.stdout | from_json).fingerprint == (pbs_storage_fingerprint | trim)
      - (pbs_storage_after.stdout | from_json).datastore == pbs_storage_datastore
    fail_msg: >-
      Storage '{{ pbs_storage_id }}' does not match intent after
      reconciliation: {{ pbs_storage_after.stdout }}
    quiet: true

- name: Read the current cluster backup jobs
  ansible.builtin.command: pvesh get /cluster/backup --output-format json
  changed_when: false
  check_mode: false
  run_once: true
  register: pbs_jobs

- name: Record the live backup job
  ansible.builtin.set_fact:
    pbs_job_live: >-
      {{ (pbs_jobs.stdout | from_json)
         | selectattr('id', 'equalto', pbs_backup_job_id)
         | list | first | default({}) }}
  run_once: true

- name: Point the existing backup job at PBS and enable it
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - "/cluster/backup/{{ pbs_backup_job_id }}"
      - --storage
      - "{{ pbs_storage_id }}"
      - --schedule
      - "{{ pbs_backup_schedule }}"
      - --mode
      - "{{ pbs_backup_mode }}"
      - --all
      - "1"
      - --exclude
      - "{{ pbs_backup_exclude_vmids | join(',') }}"
      - --enabled
      - "1"
      # Deleting, not merely omitting. The pre-existing job carried
      # `prune-backups keep-daily=7,keep-weekly=4` from its nas-backup days, and
      # leaving the property in place made PVE attempt a prune on PBS, which
      # needs Datastore.Prune that this token deliberately does not have. The
      # backup DATA succeeded and the task still reported
      #   ERROR: Backup of VM 105 failed - error pruning backups
      # so every hourly run looked like a failure while the snapshots were fine.
      # A declarative role has to remove what it does not want, not just stop
      # setting it.
      - --delete
      - prune-backups
  run_once: true
  # Only when something actually differs. This previously carried
  # `changed_when: true`, so it reported a change on every single run and the
  # role could never honestly claim convergence. `prune-backups` being present
  # at all counts as drift, since PBS owns retention.
  when:
    - pbs_job_live | length > 0
    - >-
      pbs_job_live.storage | default('') != pbs_storage_id
      or (pbs_job_live.enabled | default(0) | int) != 1
      or pbs_job_live.schedule | default('') != pbs_backup_schedule
      or pbs_job_live.mode | default('') != pbs_backup_mode
      or (pbs_job_live.exclude | default('')) != (pbs_backup_exclude_vmids | join(','))
      or ('prune-backups' in pbs_job_live)
  register: pbs_job_updated

- name: Re-read the backup job to confirm it points at PBS and is enabled
  ansible.builtin.command: pvesh get /cluster/backup/{{ pbs_backup_job_id }} --output-format json
  changed_when: false
  check_mode: false
  run_once: true
  register: pbs_job_after

# A job that exists but is disabled, or points at a storage that does not
# exist, is exactly the state this role was written to end. Assert the end
# state rather than trusting that the set command returned 0.
- name: Assert the backup job is enabled and targets the PBS storage
  run_once: true
  ansible.builtin.assert:
    that:
      - (pbs_job_after.stdout | from_json).storage == pbs_storage_id
      - (pbs_job_after.stdout | from_json).enabled | int == 1
      - (pbs_job_after.stdout | from_json).schedule == pbs_backup_schedule
    fail_msg: >-
      Backup job {{ pbs_backup_job_id }} is not in the expected state:
      {{ pbs_job_after.stdout }}
    quiet: true
