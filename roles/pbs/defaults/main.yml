---
# Proxmox Backup Server, in-guest configuration.
#
# The VMs themselves (pbs1 vmid 103 on pve, pbs2 vmid 120 on pve2) are owned by
# terraform-quasarlab (proxmox/pbs). This role never creates or resizes them.
# It configures what lives inside the guest.

# PBS 3.x is the bookworm line and is the correct pair for PVE 8.4.
# When the cluster moves to PVE 9 (Debian 13 trixie), PBS 4.x on trixie is the
# matching release and this suite needs revisiting together with the storage
# plugin migration. See project_2026-09-21_thin_provisioning_and_pve9.
pbs_repo_suite: bookworm
pbs_repo_component: pbs-no-subscription
pbs_repo_url: "http://download.proxmox.com/debian/pbs"
pbs_release_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-{{ pbs_repo_suite }}.gpg"
pbs_release_key_path: /usr/share/keyrings/proxmox-archive-keyring.gpg

# The datastore disk is scsi1 on both guests, which the kernel enumerates
# INCONSISTENTLY: on pbs1 scsi1 is /dev/sdb, on pbs2 it is /dev/sda, because
# cloud-init attaches them in a different order. Verified 2026-10-03:
#
#   pbs1  scsi-0:0:0:0 -> sda (root=/dev/sda1)   scsi-0:0:0:1 -> sdb
#   pbs2  scsi-0:0:0:0 -> sdb (root=/dev/sdb1)   scsi-0:0:0:1 -> sda
#
# So this role resolves the disk by its stable virtual SCSI LUN slot, never by
# kernel name. A role hardcoding /dev/sdb would have formatted pbs2's root disk.
pbs_datastore_lun_glob: "/dev/disk/by-path/*-scsi-0:0:0:1"
pbs_datastore_expected_gb: 600
# How far the measured disk may deviate from the expected size before this role
# refuses to touch it. Guards against the glob resolving to something unexpected.
pbs_datastore_size_tolerance_gb: 32

pbs_datastore_name: lab
pbs_datastore_mount: /mnt/datastore/lab
pbs_datastore_fstype: ext4

# Retention. Deliberately expressed here rather than only in the PVE job so the
# datastore enforces its own floor even if a job is misconfigured.
pbs_prune_keep_hourly: 24
pbs_prune_keep_daily: 7
pbs_prune_keep_weekly: 4
pbs_prune_keep_monthly: 3

pbs_prune_schedule: "hourly"
# Schedules are systemd calendar events, validated against `systemd-analyze
# calendar` before use. "daily 03:30" is NOT valid: the shorthands (hourly,
# daily, weekly) are complete expressions and cannot take a time, which cost a
# failed run to discover. Use a bare time for "every day at".
pbs_gc_schedule: "03:30"
pbs_verify_job_id: "verify-{{ pbs_datastore_name }}"
pbs_verify_schedule: "weekly"
# Verify re-reads stored chunks, so it is the only thing that proves a backup is
# readable rather than merely present. Keep it on.
pbs_verify_outdated_after_days: 30

# The PVE-side client identity. PVE authenticates with the API token; the token
# SECRET is created once by hand and stored in 1Password (item
# "PBS pve@pbs!pve token", Infrastructure vault), because generating it is not
# an idempotent operation. The user and the ACLs below are managed here.
#
# Both the user AND the token need the roles. A PBS API token's effective
# privileges are the INTERSECTION of the token's ACL and the owning user's ACL,
# so granting only the token yields an empty permission set: the datastore list
# comes back as {"data":[]} over the API, and `pvesm add pbs` then fails with
# "Cannot find datastore 'lab', check permissions and existence!" while the
# token still authenticates with HTTP 200. Verified 2026-10-06.
#
# DatastoreAudit is required on top of DatastoreBackup because `pvesm add`
# validates the datastore by enumerating it, which Backup alone does not allow.
pbs_pve_user: "pve@pbs"
pbs_pve_token_authid: "pve@pbs!pve"
pbs_pve_roles:
  - DatastoreBackup
  - DatastoreAudit

# Backup freshness metrics for node_exporter's textfile collector.
#
# Prometheus carried 295 alert rules and none of them mentioned backups, so a
# silent backup failure would only have surfaced during a restore. The
# collector reads the datastore from disk rather than the PBS API, which keeps
# it free of a token to provision, rotate and have expire quietly.
pbs_metrics_enabled: true
pbs_metrics_textfile_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfiles') }}"
pbs_metrics_prom_file: "{{ pbs_metrics_textfile_dir }}/pbs_backup.prom"
pbs_metrics_datastore_root: /mnt/datastore

# ---------------------------------------------------------------------------
# PVE client identity: not every PBS host serves PVE
# ---------------------------------------------------------------------------
# pbs1 receives backups from PVE directly. pbs2 is a pull replica: nothing
# backs up to it, so `pve@pbs!pve` does not exist there and the end-state
# assertion above would fail against an empty permission set. That assertion is
# worth keeping exactly as strict as it is, so the block is skipped on hosts
# that have no PVE client rather than weakened for all of them.
#
# A failover to pbs2 is therefore NOT just repointing PVE at it: the token is
# per-host and its secret cannot be chosen, so failover means generating a
# token on pbs2 and updating the PVE storage. See README.
pbs_configure_pve_client: true

# ---------------------------------------------------------------------------
# Pull replication
# ---------------------------------------------------------------------------
# Until this exists every backup in the lab sits on pbs1, and the vzdump job
# excludes 103 and 120, so the backup servers do not back each other up. One
# host loss takes every restore point with it.
#
# Replication is a PULL: pbs2 reaches out to pbs1 and fetches. That direction
# is deliberate. A push would need credentials on pbs1 that can WRITE to pbs2,
# so anything that compromises or corrupts the primary reaches the copy. Pull
# means pbs1 holds no credential for pbs2 at all, and the reader identity below
# is read-only even in the direction that does exist.

# SOURCE SIDE (pbs1). The reader identities replicas authenticate as.
# The token itself is NOT created here: `user generate-token` reveals its
# secret exactly once and so cannot be idempotent, the same reason
# `pve@pbs!pve` is an operator step. The role creates the user, grants the
# ACLs, and asserts the END STATE, so a missing token fails loudly with the
# command to fix it rather than silently leaving replication unauthenticated.
pbs_sync_readers: []
#   - user: "sync@pbs"
#     token_authid: "sync@pbs!pbs2"

# DatastoreReader, never DatastoreBackup. The replica only ever reads the
# source, so a leaked replica credential cannot write to, prune, or delete
# anything on the primary.
pbs_sync_reader_roles:
  - DatastoreReader

# REPLICA SIDE (pbs2). Remotes to pull from.
# `token_env` names an environment variable holding that remote's token
# secret, the same pattern as roles/pve/pbs_storage (PBS_TOKEN_SECRET). The
# secret is never written to the repo, and the task that consumes it is
# no_log.
pbs_sync_remotes: []
#   - name: pbs1
#     host: 192.168.1.61
#     auth_id: "sync@pbs!pbs2"
#     fingerprint: "c5:91:..."
#     token_env: PBS_SYNC_TOKEN_SECRET

# Default environment variable holding a remote's token secret, overridable
# per remote with `token_env` when a replica pulls from more than one source.
pbs_sync_remote_token_env: PBS_SYNC_TOKEN_SECRET

pbs_sync_jobs: []
#   - id: sync-from-pbs1
#     remote: pbs1
#     remote_store: lab
#     store: lab

# Hourly at :30 rather than a once-a-day time, and this is the safe default
# precisely because it does not depend on knowing when backups run.
#
# A daily sync has to be placed AFTER the backup window, so it silently
# becomes wrong the moment that window moves. When the vzdump job goes from
# hourly to daily at 10:00 UTC (ansible-quasarlab#241), a 04:00 sync lands 18
# hours BEFORE the backups it is supposed to copy, and the replica's newest
# snapshot peaks at 42 hours old. Even placed correctly at 12:00 it peaks at
# 26 hours.
#
# Syncing hourly bounds the replica at about one hour behind the primary no
# matter when backups run, and the runs that find nothing new are close to
# free: PBS compares snapshot lists and transfers only missing chunks, under
# the pbs_sync_rate_in ceiling. The :30 offset keeps it off the top of the
# hour, where scheduled jobs cluster.
pbs_sync_schedule: "*-*-* *:30:00"

# FALSE, and this is the whole point of the replica.
#
# With remove-vanished true the replica is a MIRROR: anything deleted on pbs1
# is deleted here on the next sync. That propagates the failure it exists to
# survive. A wiped, ransomed or mis-pruned primary would be faithfully
# replicated into the only remaining copy, and the lab would still have exactly
# one set of backups, just in two places.
#
# False means the replica only ever gains snapshots from the source. Its own
# prune job (same keep-* policy, created by this role for its own datastore)
# is what bounds its growth, so retention here is independent of whatever
# pbs1's retention happens to be.
pbs_sync_remove_vanished: false

# Ceiling on pull bandwidth, in BYTES PER SECOND. Expressed as an integer
# rather than "40MiB" because PBS stores it as a byte count, so an integer is
# what `sync-job show` returns and what the reconciliation below can compare
# against without parsing units.
#
# EARNED, 2026-10-15. The first unthrottled seed of pbs2 ran at roughly
# 80 MiB/s with ~841 requests in flight and saturated the SATA SSD that the
# replica's datastore happened to share with k8cluster3's etcd disk. pve2's io
# PSI hit 86% full, etcd fell ~700 raft indexes behind, kube-apiserver
# restarted 36 times on "etcdserver: request timed out", and the node went
# NotReady. The cluster kept quorum only through the two other members, one of
# which is on the same host.
#
# Moving the datastore to a quieter device is the other half of the fix, but
# relocation alone only moves the blast radius: a replica that CAN saturate a
# shared spindle will eventually find one. This is the ceiling that holds
# wherever the disk lives.
#
# 40 MiB/s is about 8% of this SSD's sequential figure and is generous for
# steady state: the datastore grows roughly 0.9 GB/hour, so an hourly delta
# moves in well under a minute. It only lengthens the one-off initial seed.
pbs_sync_rate_in: 41943040

# Re-pull a local snapshot whose verification failed. The replica runs its own
# weekly verify job, so this turns detection of a corrupt local chunk into a
# repair instead of a report.
pbs_sync_resync_corrupt: true
